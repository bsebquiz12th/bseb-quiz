<script>


/* SUPABASE */

const SUPABASE_URL =
"https://mtykdutibbyufmchaqqj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let editingId=null;



/* =========================
   LOGIN
========================= */

async function login(){

const email=
document.getElementById("email")
.value
.trim();


const password=
document.getElementById("password")
.value;


const msg=
document.getElementById("loginMessage");


if(!email || !password){

msg.textContent=
"Email और password भरें।";

msg.style.color="red";

return;

}


msg.textContent=
"Login हो रहा है...";


const {error}=
await supabaseClient.auth
.signInWithPassword({

email,
password

});


if(error){

msg.textContent=
"Login failed: "+
error.message;

msg.style.color="red";

return;

}


showAdmin();

}



/* =========================
   LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();


document
.getElementById("adminArea")
.classList
.add("hidden");


document
.getElementById("loginCard")
.classList
.remove("hidden");

}



/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

document
.getElementById("loginCard")
.classList
.add("hidden");


document
.getElementById("adminArea")
.classList
.remove("hidden");


loadChapters();

loadQuestions();

}



/* =========================
   SESSION
========================= */

async function checkSession(){

const {data}=
await supabaseClient.auth
.getSession();


if(data.session){

showAdmin();

}

}


checkSession();



/* =========================
   SYMBOL INSERT
========================= */

function insertSymbol(
fieldId,
symbol
){

const field=
document.getElementById(fieldId);


if(!field)return;


const start=
field.selectionStart;


const end=
field.selectionEnd;


const text=
field.value;


field.value=
text.substring(0,start)+
symbol+
text.substring(end);


field.focus();


field.selectionStart=
field.selectionEnd=
start+symbol.length;

}



/* =========================
   LOAD CHAPTERS
========================= */

async function loadChapters(){

const subject=
document
.getElementById("subject")
.value;


const select=
document
.getElementById("chapterSelect");


select.innerHTML=`

<option value="">
Select Chapter
</option>

<option value="__new__">
➕ Add New Chapter
</option>

`;


document
.getElementById("newChapterBox")
.classList
.add("hidden");


if(!subject){

document
.getElementById("chapterList")
.innerHTML=
"Subject चुनें।";

return;

}


const {data,error}=
await supabaseClient
.from("questions")
.select("chapter")
.eq("subject",subject)
.order("chapter");


if(error){

console.error(error);

return;

}


const chapters=[
...new Set(
(data||[])
.map(x=>x.chapter)
.filter(Boolean)
)
];


chapters.forEach(
chapter=>{

const option=
document.createElement("option");


option.value=chapter;

option.textContent=chapter;


select.appendChild(option);

});


renderChapterList(chapters);

}



/* =========================
   CHAPTER CHANGED
========================= */

function chapterChanged(){

const value=
document
.getElementById("chapterSelect")
.value;


const box=
document
.getElementById("newChapterBox");


if(value==="__new__"){

box.classList
.remove("hidden");

}else{

box.classList
.add("hidden");

}

}



/* =========================
   GET CHAPTER
========================= */

function getChapterName(){

const selected=
document
.getElementById("chapterSelect")
.value;


if(selected==="__new__"){

return document
.getElementById("newChapter")
.value
.trim();

}


return selected;

}



/* =========================
   SAVE QUESTION
========================= */

async function saveQuestion(){

const subject=
document
.getElementById("subject")
.value;


const chapter=
getChapterName();


const question=
document
.getElementById("question")
.value
.trim();


const option_a=
document
.getElementById("option_a")
.value
.trim();


const option_b=
document
.getElementById("option_b")
.value
.trim();


const option_c=
document
.getElementById("option_c")
.value
.trim();


const option_d=
document
.getElementById("option_d")
.value
.trim();


const correct_answer=
Number(
document
.getElementById("correct_answer")
.value
);


if(
!subject ||
!chapter ||
!question ||
!option_a ||
!option_b ||
!option_c ||
!option_d
){

showMessage(
"सभी fields भरें।",
"red"
);

return;

}


const questionData={

subject,
chapter,
question,
option_a,
option_b,
option_c,
option_d,
correct_answer

};



/* UPDATE QUESTION */

if(editingId!==null){

const {error}=
await supabaseClient
.from("questions")
.update(questionData)
.eq("id",editingId);


if(error){

showMessage(
"Update failed: "+
error.message,
"red"
);

return;

}


showMessage(
"Question updated successfully.",
"green"
);


cancelEdit();

await loadChapters();

loadQuestions();

return;

}



/* ADD QUESTION */

const {error}=
await supabaseClient
.from("questions")
.insert([
questionData
]);


if(error){

showMessage(
"Add failed: "+
error.message,
"red"
);

return;

}


showMessage(
"Question successfully added.",
"green"
);


/* KEEP SAME CHAPTER */

await loadChapters();


document
.getElementById("chapterSelect")
.value=chapter;


document
.getElementById("newChapterBox")
.classList
.add("hidden");


/* CLEAR ONLY QUESTION */

clearQuestionFields();


loadQuestions();

}



/* =========================
   CLEAR QUESTION FIELDS
========================= */

function clearQuestionFields(){

document
.getElementById("question")
.value="";


document
.getElementById("option_a")
.value="";


document
.getElementById("option_b")
.value="";


document
.getElementById("option_c")
.value="";


document
.getElementById("option_d")
.value="";


document
.getElementById("correct_answer")
.value="0";

}



/* =========================
   MESSAGE
========================= */

function showMessage(
text,
color
){

const msg=
document
.getElementById("message");


msg.textContent=text;

msg.style.color=color;

}



/* =========================
   CHAPTER LIST
========================= */

async function renderChapterList(
chapters
){

const container=
document
.getElementById("chapterList");


if(!chapters.length){

container.innerHTML=
"No chapters found.";

return;

}


container.innerHTML="";


for(
const chapter of chapters
){

const box=
document.createElement("div");


box.className=
"chapter-box";


box.innerHTML=`

<div class="chapter-name">

${escapeHtml(chapter)}

</div>


<div class="small">
Questions checking...
</div>


<div class="buttons">

<button
class="warning"
onclick='renameChapter(${JSON.stringify(chapter)})'
>
✏️ Rename
</button>


<button
class="danger"
onclick='deleteChapter(${JSON.stringify(chapter)})'
>
🗑️ Delete Chapter
</button>

</div>

`;


container.appendChild(box);



/* QUESTION COUNT */

const subject=
document
.getElementById("subject")
.value;


const {count}=
await supabaseClient
.from("questions")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq("subject",subject)
.eq("chapter",chapter);


const countElement=
box.querySelector(".small");


countElement.textContent=
`${count||0} question(s)`;

}

}



/* =========================
   RENAME CHAPTER
========================= */

async function renameChapter(
oldName
){

const subject=
document
.getElementById("subject")
.value;


const newName=
prompt(
`"${oldName}" का नया नाम लिखें:`,
oldName
);


if(newName===null)return;


const trimmed=
newName.trim();


if(!trimmed){

alert(
"Chapter name खाली नहीं हो सकता।"
);

return;

}


if(trimmed===oldName){

return;

}



/* SAME NAME CHECK */

const {data:existing}=
await supabaseClient
.from("questions")
.select("id")
.eq("subject",subject)
.eq("chapter",trimmed)
.limit(1);


if(
existing &&
existing.length
){

alert(
"यह chapter name पहले से मौजूद है।"
);

return;

}



/* RENAME ALL QUESTIONS */

const {error}=
await supabaseClient
.from("questions")
.update({
chapter:trimmed
})
.eq("subject",subject)
.eq("chapter",oldName);


if(error){

alert(
"Chapter rename failed: "+
error.message
);

return;

}


alert(
`Chapter "${oldName}" का नाम बदलकर "${trimmed}" कर दिया गया।`
);


await loadChapters();

loadQuestions();

}



/* =========================
   DELETE CHAPTER
========================= */

async function deleteChapter(
chapter
){

const subject=
document
.getElementById("subject")
.value;


const {count,error}=
await supabaseClient
.from("questions")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq("subject",subject)
.eq("chapter",chapter);


if(error){

alert(
"Chapter information नहीं मिल पाई: "+
error.message
);

return;

}


const total=count||0;


const confirmDelete=
confirm(

`क्या आप "${chapter}" delete करना चाहते हैं?\n\n`+

`इस chapter में ${total} question(s) हैं।\n\n`+

`Chapter delete करने पर इसके सभी questions भी delete हो जाएंगे।`

);


if(!confirmDelete)return;



/* DELETE */

const {error:deleteError}=
await supabaseClient
.from("questions")
.delete()
.eq("subject",subject)
.eq("chapter",chapter);


if(deleteError){

alert(
"Chapter delete failed: "+
deleteError.message
);

return;

}


alert(
`"${chapter}" और उसके ${total} question(s) delete हो गए।`
);


await loadChapters();

loadQuestions();

}



/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

const list=
document

/* =========================
   EDIT QUESTION
========================= */

async function editQuestion(
id
){

const {data,error}=
await supabaseClient
.from("questions")
.select("*")
.eq("id",id)
.single();


if(error){

alert(
"Question load नहीं हुआ: "+
error.message
);

return;

}


editingId=id;


document
.getElementById("subject")
.value=data.subject;


await loadChapters();


document
.getElementById("chapterSelect")
.value=data.chapter;


document
.getElementById("question")
.value=data.question;


document
.getElementById("option_a")
.value=data.option_a;


document
.getElementById("option_b")
.value=data.option_b;


document
.getElementById("option_c")
.value=data.option_c;


document
.getElementById("option_d")
.value=data.option_d;


document
.getElementById("correct_answer")
.value=data.correct_answer;


document
.getElementById("formTitle")
.textContent=
"Edit Question";


document
.getElementById("saveButton")
.textContent=
"Update Question";


document
.getElementById("cancelButton")
.classList
.remove("hidden");


window.scrollTo({

top:0,

behavior:"smooth"

});

}



/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

editingId=null;


document
.getElementById("formTitle")
.textContent=
"Add Question";


document
.getElementById("saveButton")
.textContent=
"Add Question";


document
.getElementById("cancelButton")
.classList
.add("hidden");


clearQuestionFields();

}



/* =========================
   DELETE QUESTION
========================= */

async function deleteQuestion(
id
){

const ok=
confirm(
"क्या आप यह question delete करना चाहते हैं?"
);


if(!ok)return;


const {error}=
await supabaseClient
.from("questions")
.delete()
.eq("id",id);


if(error){

alert(
"Delete failed: "+
error.message
);

return;

}


alert(
"Question deleted."
);


loadQuestions();

loadChapters();

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
