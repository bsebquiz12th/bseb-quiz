<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BSEB Quiz 12th - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #102a43;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #102a43;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd6e0;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 15px;
    }

    .primary {
      background: #1565c0;
      color: white;
    }

    .success {
      background: #198754;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    .secondary {
      background: #6c757d;
      color: white;
    }

    .question-box {
      border: 1px solid #dbe3ec;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      background: #fafcff;
    }

    .question-text {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .meta {
      color: #667085;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    .new-chapter-box {
      background: #fff8e1;
      border: 1px solid #f0d98c;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 15px;
      }

      .card {
        padding: 16px;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>BSEB Quiz 12th — Admin Panel</h1>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Admin Login</h2>

    <label>Email</label>
    <input type="email" id="email" placeholder="Admin email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- ADMIN AREA -->
  <div id="adminArea" class="hidden">

    <div class="card">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <h2 id="formTitle">Add Question</h2>

        <button class="danger" onclick="logout()">
          Logout
        </button>
      </div>

      <!-- SUBJECT -->
      <label>Subject</label>

      <select id="subject" onchange="loadChapters()">
        <option value="">Select Subject</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Maths">Maths</option>
        <option value="Biology">Biology</option>
        <option value="Hindi">Hindi</option>
        <option value="English">English</option>
      </select>


      <!-- CHAPTER -->
      <label>Chapter</label>

      <select id="chapterSelect" onchange="chapterChanged()">
        <option value="">Select Chapter</option>
        <option value="__new__">➕ Add New Chapter</option>
      </select>


      <!-- NEW CHAPTER -->
      <div id="newChapterBox" class="new-chapter-box hidden">

        <strong>New Chapter Name</strong>

        <input
          type="text"
          id="newChapter"
          placeholder="Example: Chapter 1"
        >

        <small>
          पहली बार chapter बनाते समय ही नाम लिखें।
          बाद में यही chapter dropdown में मिल जाएगा।
        </small>

      </div>


      <!-- QUESTION -->
      <label>Question</label>

      <textarea
        id="question"
        placeholder="Enter question"
      ></textarea>


      <!-- OPTIONS -->
      <label>Option A</label>
      <input type="text" id="option_a">

      <label>Option B</label>
      <input type="text" id="option_b">

      <label>Option C</label>
      <input type="text" id="option_c">

      <label>Option D</label>
      <input type="text" id="option_d">


      <!-- ANSWER -->
      <label>Correct Answer</label>

      <select id="correct_answer">
        <option value="0">Option A</option>
        <option value="1">Option B</option>
        <option value="2">Option C</option>
        <option value="3">Option D</option>
      </select>


      <div class="buttons">

        <button
          id="saveButton"
          class="success"
          onclick="saveQuestion()">
          Add Question
        </button>

        <button
          id="cancelButton"
          class="secondary hidden"
          onclick="cancelEdit()">
          Cancel Edit
        </button>

      </div>

      <div id="message"></div>

    </div>


    <!-- QUESTIONS -->
    <div class="card">

      <h2>Questions</h2>

      <button class="primary" onclick="loadQuestions()">
        Refresh Questions
      </button>

      <div id="questionsList"></div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingId = null;


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMessage");

  if (!email || !password) {

    msg.textContent =
      "Email और password भरें।";

    return;
  }

  msg.textContent = "Login हो रहा है...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    msg.textContent =
      "Login failed: " + error.message;

    return;
  }

  msg.textContent = "";

  showAdmin();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("adminArea")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");
}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("adminArea")
    .classList.remove("hidden");

  loadChapters();

  loadQuestions();
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    showAdmin();

  }

}

checkSession();


/* =========================
   LOAD CHAPTERS
========================= */

async function loadChapters() {

  const subject =
    document.getElementById("subject").value;

  const select =
    document.getElementById("chapterSelect");

  select.innerHTML = `
    <option value="">Select Chapter</option>
    <option value="__new__">➕ Add New Chapter</option>
  `;

  document
    .getElementById("newChapterBox")
    .classList.add("hidden");

  if (!subject) return;


  const { data, error } =
    await supabaseClient
      .from("questions")
      .select("chapter")
      .eq("subject", subject)
      .order("chapter");


  if (error) {

    console.error(error);

    return;
  }


  /* UNIQUE CHAPTERS */

  const chapters = [
    ...new Set(
      (data || [])
        .map(item => item.chapter)
        .filter(Boolean)
    )
  ];


  chapters.forEach(chapter => {

    const option =
      document.createElement("option");

    option.value = chapter;

    option.textContent = chapter;

    select.appendChild(option);

  });

}


/* =========================
   CHAPTER CHANGED
========================= */

function chapterChanged() {

  const value =
    document.getElementById("chapterSelect").value;

  const newBox =
    document.getElementById("newChapterBox");

  if (value === "__new__") {

    newBox.classList.remove("hidden");

  } else {

    newBox.classList.add("hidden");

  }

}


/* =========================
   GET CHAPTER NAME
========================= */

function getChapterName() {

  const selected =
    document.getElementById("chapterSelect").value;


  if (selected === "__new__") {

    return document
      .getElementById("newChapter")
      .value
      .trim();

  }


  return selected;

}


/* =========================
   SAVE QUESTION
========================= */

async function saveQuestion() {

  const subject =
    document.getElementById("subject").value;

  const chapter =
    getChapterName();

  const question =
    document.getElementById("question").value.trim();

  const option_a =
    document.getElementById("option_a").value.trim();

  const option_b =
    document.getElementById("option_b").value.trim();

  const option_c =
    document.getElementById("option_c").value.trim();

  const option_d =
    document.getElementById("option_d").value.trim();

  const correct_answer =
    Number(
      document.getElementById("correct_answer").value
    );


  if (
    !subject ||
    !chapter ||
    !question ||
    !option_a ||
    !option_b ||
    !option_c ||
    !option_d
  ) {

    showMessage(
      "सभी fields भरें।",
      "red"
    );

    return;
  }


  const questionData = {

    subject,
    chapter,
    question,
    option_a,
    option_b,
    option_c,
    option_d,
    correct_answer

  };


  /* UPDATE */

  if (editingId !== null) {

    const { error } =
      await supabaseClient
        .from("questions")
        .update(questionData)
        .eq("id", editingId);


    if (error) {

      showMessage(
        "Update failed: " + error.message,
        "red"
      );

      return;
    }


    showMessage(
      "Question updated successfully.",
      "green"
    );

    cancelEdit();

    loadChapters();

    loadQuestions();

    return;
  }


  /* INSERT */

  const { error } =
    await supabaseClient
      .from("questions")
      .insert([questionData]);


  if (error) {

    showMessage(
      "Add failed: " + error.message,
      "red"
    );

    return;
  }


  showMessage(
    "Question successfully added.",
    "green"
  );


  /*
    अगर नया chapter था,
    तो dropdown दोबारा load होगा।
  */

  await loadChapters();


  /* वही chapter select करें */

  document
    .getElementById("chapterSelect")
    .value = chapter;


  document
    .getElementById("newChapterBox")
    .classList.add("hidden");


  /*
    सिर्फ question fields साफ होंगे।
    Subject और Chapter वही रहेंगे।
  */

  document
    .getElementById("question")
    .value = "";

  document
    .getElementById("option_a")
    .value = "";

  document
    .getElementById("option_b")
    .value = "";

  document
    .getElementById("option_c")
    .value = "";

  document
    .getElementById("option_d")
    .value = "";

  document
    .getElementById("correct_answer")
    .value = "0";


  loadQuestions();

}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(text, color) {

  const msg =
    document.getElementById("message");

  msg.textContent = text;

  msg.style.color = color;

}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions() {

  const list =
    document.getElementById("questionsList");

  list.innerHTML =
    "Questions loading...";


  const { data, error } =
    await supabaseClient
      .from("questions")
      .select("*")
      .order("subject")
      .order("chapter")
      .order("id");


  if (error) {

    list.innerHTML =
      "Error: " + error.message;

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML =
      "अभी कोई question नहीं है।";

    return;
  }


  list.innerHTML = "";


  data.forEach(item => {

    const box =
      document.createElement("div");

    box.className =
      "question-box";


    const correctOption =
      ["A", "B", "C", "D"][item.correct_answer];


    box.innerHTML = `

      <div class="meta">
        ${escapeHtml(item.subject)}
        —
        ${escapeHtml(item.chapter)}
      </div>

      <div class="question-text">
        ${escapeHtml(item.question)}
      </div>

      <div>A. ${escapeHtml(item.option_a)}</div>
      <div>B. ${escapeHtml(item.option_b)}</div>
      <div>C. ${escapeHtml(item.option_c)}</div>
      <div>D. ${escapeHtml(item.option_d)}</div>

      <div style="margin-top:8px;font-weight:bold;">
        Correct Answer: ${correctOption}
      </div>

      <div class="buttons">

        <button
          class="primary"
          onclick="editQuestion(${item.id})">
          ✏️ Edit
        </button>

        <button
          class="danger"
          onclick="deleteQuestion(${item.id})">
          🗑️ Delete
        </button>

      </div>

    `;


    list.appendChild(box);

  });

}


/* =========================
   EDIT QUESTION
========================= */

async function editQuestion(id) {

  const { data, error } =
    await supabaseClient
      .from("questions")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    alert(
      "Question load नहीं हुआ: " +
      error.message
    );

    return;
  }


  editingId = id;


  document
    .getElementById("subject")
    .value = data.subject;


  await loadChapters();


  document
    .getElementById("chapterSelect")
    .value = data.chapter;


  document
    .getElementById("question")
    .value = data.question;

  document
    .getElementById("option_a")
    .value = data.option_a;

  document
    .getElementById("option_b")
    .value = data.option_b;

  document
    .getElementById("option_c")
    .value = data.option_c;

  document
    .getElementById("option_d")
    .value = data.option_d;

  document
    .getElementById("correct_answer")
    .value = data.correct_answer;


  document
    .getElementById("formTitle")
    .textContent = "Edit Question";


  document
    .getElementById("saveButton")
    .textContent = "Update Question";


  document
    .getElementById("cancelButton")
    .classList.remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  editingId = null;


  document
    .getElementById("formTitle")
    .textContent = "Add Question";


  document
    .getElementById("saveButton")
    .textContent = "Add Question";


  document
    .getElementById("cancelButton")
    .classList.add("hidden");


  clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

  document
    .getElementById("question")
    .value = "";

  document
    .getElementById("option_a")
    .value = "";

  document
    .getElementById("option_b")
    .value = "";

  document
    .getElementById("option_c")
    .value = "";

  document
    .getElementById("option_d")
    .value = "";

}


/* =========================
   DELETE
========================= */

async function deleteQuestion(id) {

  const ok =
    confirm(
      "क्या आप यह question delete करना चाहते हैं?"
    );


  if (!ok) return;


  const { error } =
    await supabaseClient
      .from("questions")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  alert("Question deleted.");

  loadQuestions();

  loadChapters();

}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
