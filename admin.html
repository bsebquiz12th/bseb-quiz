<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSEB Quiz 12th - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#102a43;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

h2{
  margin-top:0;
  color:#102a43;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd6e0;
  border-radius:7px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  margin-top:10px;
}

.primary{background:#1565c0;color:white}
.success{background:#198754;color:white}
.danger{background:#dc3545;color:white}
.warning{background:#f0ad00;color:#111}
.secondary{background:#6c757d;color:white}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hidden{
  display:none;
}

#message,#loginMessage{
  margin-top:12px;
  font-weight:bold;
}

.chapter-box{
  border:1px solid #dbe3ec;
  border-radius:10px;
  padding:14px;
  margin-top:12px;
  background:#fafcff;
}

.chapter-name{
  font-weight:bold;
  font-size:17px;
  color:#102a43;
}

.question-box{
  border:1px solid #dbe3ec;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
  background:#fafcff;
}

.question-text{
  font-weight:bold;
  margin-bottom:10px;
}

.meta{
  color:#667085;
  font-size:14px;
  margin-bottom:8px;
}

.small{
  color:#667085;
  font-size:13px;
}

.new-chapter-box{
  background:#fff8e1;
  border:1px solid #f0d98c;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
}

.manage-title{
  margin-top:25px;
  border-top:1px solid #ddd;
  padding-top:20px;
}

@media(max-width:600px){
  .container{margin-top:15px}
  .card{padding:16px}
  header h1{font-size:20px}
}
</style>
</head>

<body>

<header>
<h1>BSEB Quiz 12th — Admin Panel</h1>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h2>Admin Login</h2>

<label>Email</label>
<input type="email" id="email" placeholder="Admin email">

<label>Password</label>
<input type="password" id="password" placeholder="Password">

<button class="primary" onclick="login()">Login</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN AREA -->

<div id="adminArea" class="hidden">


<!-- QUESTION FORM -->

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

<h2 id="formTitle">Add Question</h2>

<button class="danger" onclick="logout()">Logout</button>

</div>


<label>Subject</label>

<select id="subject" onchange="loadChapters()">

<option value="">Select Subject</option>
<option value="Physics">Physics</option>
<option value="Chemistry">Chemistry</option>
<option value="Maths">Maths</option>
<option value="Biology">Biology</option>
<option value="Hindi">Hindi</option>
<option value="English">English</option>

</select>


<label>Chapter</label>

<select id="chapterSelect" onchange="chapterChanged()">

<option value="">Select Chapter</option>
<option value="__new__">➕ Add New Chapter</option>

</select>


<div id="newChapterBox" class="new-chapter-box hidden">

<strong>New Chapter Name</strong>

<input
id="newChapter"
type="text"
placeholder="Example: Chapter 1 - Electric Charges"
>

<div class="small">
नया chapter सिर्फ पहली बार नाम देकर बनाना है।
</div>

</div>


<label>Question</label>

<textarea
id="question"
placeholder="Enter question">
</textarea>


<label>Option A</label>
<input id="option_a" type="text">

<label>Option B</label>
<input id="option_b" type="text">

<label>Option C</label>
<input id="option_c" type="text">

<label>Option D</label>
<input id="option_d" type="text">


<label>Correct Answer</label>

<select id="correct_answer">

<option value="0">Option A</option>
<option value="1">Option B</option>
<option value="2">Option C</option>
<option value="3">Option D</option>

</select>


<div class="buttons">

<button
id="saveButton"
class="success"
onclick="saveQuestion()">
Add Question
</button>

<button
id="cancelButton"
class="secondary hidden"
onclick="cancelEdit()">
Cancel Edit
</button>

</div>

<div id="message"></div>

</div>


<!-- CHAPTER MANAGEMENT -->

<div class="card">

<h2>Manage Chapters</h2>

<div class="small">
पहले Subject चुनें। फिर उस Subject के Chapters यहाँ दिखाई देंगे।
</div>

<div id="chapterList">
Subject चुनें।
</div>

</div>


<!-- QUESTIONS -->

<div class="card">

<h2>Questions</h2>

<button class="primary" onclick="loadQuestions()">
Refresh Questions
</button>

<div id="questionsList"></div>

</div>


</div>

</div>


<script>

const SUPABASE_URL =
"https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let editingId=null;


/* LOGIN */

async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("loginMessage");

if(!email || !password){

msg.textContent="Email और password भरें।";
msg.style.color="red";
return;

}

msg.textContent="Login हो रहा है...";

const {error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

msg.textContent="Login failed: "+error.message;
msg.style.color="red";
return;

}

showAdmin();

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

document.getElementById("adminArea")
.classList.add("hidden");

document.getElementById("loginCard")
.classList.remove("hidden");

}


/* SHOW ADMIN */

function showAdmin(){

document.getElementById("loginCard")
.classList.add("hidden");

document.getElementById("adminArea")
.classList.remove("hidden");

loadChapters();
loadQuestions();

}


/* SESSION */

async function checkSession(){

const {data}=await supabaseClient.auth.getSession();

if(data.session){
showAdmin();
}

}

checkSession();


/* LOAD CHAPTERS */

async function loadChapters(){

const subject=document.getElementById("subject").value;

const select=document.getElementById("chapterSelect");

select.innerHTML=`
<option value="">Select Chapter</option>
<option value="__new__">➕ Add New Chapter</option>
`;

document.getElementById("newChapterBox")
.classList.add("hidden");

if(!subject){

document.getElementById("chapterList")
.innerHTML="Subject चुनें।";

return;

}

const {data,error}=await supabaseClient
.from("questions")
.select("chapter")
.eq("subject",subject)
.order("chapter");

if(error){

console.error(error);
return;

}

const chapters=[
...new Set(
(data||[])
.map(x=>x.chapter)
.filter(Boolean)
)
];


chapters.forEach(chapter=>{

const option=document.createElement("option");

option.value=chapter;
option.textContent=chapter;

select.appendChild(option);

});


renderChapterList(chapters);

}


/* CHAPTER SELECT */

function chapterChanged(){

const value=document.getElementById("chapterSelect").value;

const box=document.getElementById("newChapterBox");

if(value==="__new__"){

box.classList.remove("hidden");

}else{

box.classList.add("hidden");

}

}


/* GET CHAPTER */

function getChapterName(){

const selected=document.getElementById("chapterSelect").value;

if(selected==="__new__"){

return document
.getElementById("newChapter")
.value
.trim();

}

return selected;

}


/* ADD / UPDATE QUESTION */

async function saveQuestion(){

const subject=document.getElementById("subject").value;

const chapter=getChapterName();

const question=document.getElementById("question").value.trim();

const option_a=document.getElementById("option_a").value.trim();

const option_b=document.getElementById("option_b").value.trim();

const option_c=document.getElementById("option_c").value.trim();

const option_d=document.getElementById("option_d").value.trim();

const correct_answer=Number(
document.getElementById("correct_answer").value
);


if(
!subject ||
!chapter ||
!question ||
!option_a ||
!option_b ||
!option_c ||
!option_d
){

showMessage("सभी fields भरें।","red");
return;

}


const questionData={
subject,
chapter,
question,
option_a,
option_b,
option_c,
option_d,
correct_answer
};


/* UPDATE */

if(editingId!==null){

const {error}=await supabaseClient
.from("questions")
.update(questionData)
.eq("id",editingId);

if(error){

showMessage(
"Update failed: "+error.message,
"red"
);

return;

}

showMessage(
"Question updated successfully.",
"green"
);

cancelEdit();

await loadChapters();
loadQuestions();

return;

}


/* INSERT */

const {error}=await supabaseClient
.from("questions")
.insert([questionData]);

if(error){

showMessage(
"Add failed: "+error.message,
"red"
);

return;

}


showMessage(
"Question successfully added.",
"green"
);


await loadChapters();


document.getElementById("chapterSelect")
.value=chapter;

document.getElementById("newChapterBox")
.classList.add("hidden");


clearQuestionFields();

loadQuestions();

}


/* CLEAR QUESTION ONLY */

function clearQuestionFields(){

document.getElementById("question").value="";
document.getElementById("option_a").value="";
document.getElementById("option_b").value="";
document.getElementById("option_c").value="";
document.getElementById("option_d").value="";
document.getElementById("correct_answer").value="0";

}


/* MESSAGE */

function showMessage(text,color){

const msg=document.getElementById("message");

msg.textContent=text;
msg.style.color=color;

}


/* RENDER CHAPTER LIST */

async function renderChapterList(chapters){

const container=document.getElementById("chapterList");

if(!chapters.length){

container.innerHTML=
"No chapters found.";

return;

}

container.innerHTML="";


for(const chapter of chapters){

const box=document.createElement("div");

box.className="chapter-box";

box.innerHTML=`

<div class="chapter-name">
${escapeHtml(chapter)}
</div>

<div class="small" id="count-${encodeURIComponent(chapter)}">
Questions checking...
</div>

<div class="buttons">

<button
class="warning"
onclick="renameChapter(${JSON.stringify(chapter)})">
✏️ Rename
</button>

<button
class="danger"
onclick="deleteChapter(${JSON.stringify(chapter)})">
🗑️ Delete Chapter
</button>

</div>

`;

container.appendChild(box);


/* QUESTION COUNT */

const subject=document.getElementById("subject").value;

const {count}=await supabaseClient
.from("questions")
.select("id",{count:"exact",head:true})
.eq("subject",subject)
.eq("chapter",chapter);

const countElement=
box.querySelector(".small");

countElement.textContent=
`${count||0} question(s)`;

}

}


/* RENAME CHAPTER */

async function renameChapter(oldName){

const subject=document.getElementById("subject").value;

const newName=prompt(
`"${oldName}" का नया नाम लिखें:`,
oldName
);

if(newName===null)return;

const trimmed=newName.trim();

if(!trimmed){

alert("Chapter name खाली नहीं हो सकता।");
return;

}

if(trimmed===oldName){

return;

}


/* CHECK SAME NAME */

const {data:existing}=await supabaseClient
.from("questions")
.select("id")
.eq("subject",subject)
.eq("chapter",trimmed)
.limit(1);

if(existing && existing.length){

alert(
"यह chapter name पहले से मौजूद है।"
);

return;

}


/* UPDATE ALL QUESTIONS */

const {error}=await supabaseClient
.from("questions")
.update({
chapter:trimmed
})
.eq("subject",subject)
.eq("chapter",oldName);

if(error){

alert(
"Chapter rename failed: "+
error.message
);

return;

}


alert(
`Chapter "${oldName}" का नाम बदलकर "${trimmed}" कर दिया गया।`
);


await loadChapters();

loadQuestions();

}


/* DELETE CHAPTER */

async function deleteChapter(chapter){

const subject=document.getElementById("subject").value;


/* COUNT */

const {count,error:countError}=await supabaseClient
.from("questions")
.select("id",{count:"exact",head:true})
.eq("subject",subject)
.eq("chapter",chapter);

if(countError){

alert(
"Chapter information नहीं मिल पाई: "+
countError.message
);

return;

}


const total=count||0;


const confirmDelete=confirm(
`क्या आप "${chapter}" delete करना चाहते हैं?\n\n`+
`इस chapter में ${total} question(s) हैं।\n\n`+
`Chapter delete करने पर इसके सभी questions भी delete हो जाएंगे।`
);


if(!confirmDelete)return;


/* DELETE QUESTIONS */

const {error}=await supabaseClient
.from("questions")
.delete()
.eq("subject",subject)
.eq("chapter",chapter);


if(error){

alert(
"Chapter delete failed: "+
error.message
);

return;

}


alert(
`"${chapter}" और उसके ${total} question(s) delete हो गए।`
);


await loadChapters();

loadQuestions();

}


/* LOAD QUESTIONS */

async function loadQuestions(){

const list=document.getElementById("questionsList");

list.innerHTML="Questions loading...";


const {data,error}=await supabaseClient
.from("questions")
.select("*")
.order("subject")
.order("chapter")
.order("id");


if(error){

list.innerHTML="Error: "+error.message;
return;

}


if(!data || !data.length){

list.innerHTML="अभी कोई question नहीं है।";
return;

}


list.innerHTML="";


data.forEach(item=>{

const box=document.createElement("div");

box.className="question-box";


const correctOption=
["A","B","C","D"][item.correct_answer];


box.innerHTML=`

<div class="meta">
${escapeHtml(item.subject)} —
${escapeHtml(item.chapter)}
</div>

<div class="question-text">
${escapeHtml(item.question)}
</div>

<div>A. ${escapeHtml(item.option_a)}</div>
<div>B. ${escapeHtml(item.option_b)}</div>
<div>C. ${escapeHtml(item.option_c)}</div>
<div>D. ${escapeHtml(item.option_d)}</div>

<div style="margin-top:8px;font-weight:bold;">
Correct Answer: ${correctOption}
</div>

<div class="buttons">

<button
class="primary"
onclick="editQuestion(${item.id})">
✏️ Edit
</button>

<button
class="danger"
onclick="deleteQuestion(${item.id})">
🗑️ Delete
</button>

</div>

`;

list.appendChild(box);

});

}


/* EDIT QUESTION */

async function editQuestion(id){

const {data,error}=await supabaseClient
.from("questions")
.select("*")
.eq("id",id)
.single();


if(error){

alert(
"Question load नहीं हुआ: "+
error.message
);

return;

}


editingId=id;


document.getElementById("subject").value=data.subject;

await loadChapters();


document.getElementById("chapterSelect")
.value=data.chapter;


document.getElementById("question").value=data.question;

document.getElementById("option_a").value=data.option_a;

document.getElementById("option_b").value=data.option_b;

document.getElementById("option_c").value=data.option_c;

document.getElementById("option_d").value=data.option_d;

document.getElementById("correct_answer")
.value=data.correct_answer;


document.getElementById("formTitle")
.textContent="Edit Question";


document.getElementById("saveButton")
.textContent="Update Question";


document.getElementById("cancelButton")
.classList.remove("hidden");


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* CANCEL EDIT */

function cancelEdit(){

editingId=null;

document.getElementById("formTitle")
.textContent="Add Question";

document.getElementById("saveButton")
.textContent="Add Question";

document.getElementById("cancelButton")
.classList.add("hidden");

clearQuestionFields();

}


/* DELETE QUESTION */

async function deleteQuestion(id){

const ok=confirm(
"क्या आप यह question delete करना चाहते हैं?"
);

if(!ok)return;


const {error}=await supabaseClient
.from("questions")
.delete()
.eq("id",id);


if(error){

alert(
"Delete failed: "+
error.message
);

return;

}


alert("Question deleted.");

loadQuestions();
loadChapters();

}


/* HTML ESCAPE */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
