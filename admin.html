<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSEB Quiz 12th - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#102a43;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{margin:0;font-size:24px}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

h2{margin-top:0;color:#102a43}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd6e0;
  border-radius:7px;
  font-size:15px;
}

textarea{min-height:90px;resize:vertical}

button{
  border:0;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  margin-top:10px;
}

button:disabled{opacity:.6;cursor:not-allowed}

.primary{background:#1565c0;color:white}
.success{background:#198754;color:white}
.danger{background:#dc3545;color:white}
.warning{background:#f0ad00;color:#111}
.secondary{background:#6c757d;color:white}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hidden{display:none}

#message,#loginMessage{
  margin-top:12px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.chapter-box,.question-box{
  border:1px solid #dbe3ec;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
  background:#fafcff;
}

.chapter-name{
  font-weight:bold;
  font-size:17px;
  color:#102a43;
  overflow-wrap:anywhere;
}

.question-text{
  font-weight:bold;
  margin-bottom:10px;
  overflow-wrap:anywhere;
}

.meta,.small{
  color:#667085;
  font-size:13px;
  margin-bottom:8px;
}

.new-chapter-box{
  background:#fff8e1;
  border:1px solid #f0d98c;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
}

@media(max-width:600px){
  .container{margin-top:15px}
  .card{padding:16px}
  header h1{font-size:20px}
}
</style>
</head>

<body>

<header>
  <h1>BSEB Quiz 12th — Admin Panel</h1>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Admin Login</h2>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Admin email"
           autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password"
           autocomplete="current-password">

    <button type="button" id="loginButton"
            class="primary" onclick="login()">Login</button>

    <div id="loginMessage" role="status"></div>
  </div>

  <!-- ADMIN AREA -->
  <div id="adminArea" class="hidden">

    <!-- QUESTION FORM -->
    <div class="card">

      <div style="display:flex;justify-content:space-between;
                  align-items:center;flex-wrap:wrap;gap:10px">
        <h2 id="formTitle">Add Question</h2>
        <button type="button" class="danger"
                onclick="logout()">Logout</button>
      </div>

      <label for="subject">Subject</label>
      <select id="subject" onchange="loadChapters()">
        <option value="">Select Subject</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Maths">Maths</option>
        <option value="Biology">Biology</option>
        <option value="Hindi">Hindi</option>
        <option value="English">English</option>
      </select>

      <label for="chapterSelect">Chapter</label>
      <select id="chapterSelect" onchange="chapterChanged()">
        <option value="">Select Chapter</option>
        <option value="__new__">➕ Add New Chapter</option>
      </select>

      <div id="newChapterBox" class="new-chapter-box hidden">
        <strong>New Chapter Name</strong>
        <input id="newChapter" type="text"
               placeholder="Example: Chapter 1 - Electric Charges">
        <div class="small">
          नया chapter बनाने के लिए उसका नाम लिखें।
        </div>
      </div>

      <label for="question">Question</label>
      <textarea id="question" placeholder="Enter question"></textarea>

      <label for="option_a">Option A</label>
      <input id="option_a" type="text">

      <label for="option_b">Option B</label>
      <input id="option_b" type="text">

      <label for="option_c">Option C</label>
      <input id="option_c" type="text">

      <label for="option_d">Option D</label>
      <input id="option_d" type="text">

      <label for="correct_answer">Correct Answer</label>
      <select id="correct_answer">
        <option value="0">Option A</option>
        <option value="1">Option B</option>
        <option value="2">Option C</option>
        <option value="3">Option D</option>
      </select>

      <div class="buttons">
        <button type="button" id="saveButton"
                class="success" onclick="saveQuestion()">
          Add Question
        </button>
        <button type="button" id="cancelButton"
                class="secondary hidden" onclick="cancelEdit()">
          Cancel Edit
        </button>
      </div>

      <div id="message" role="status"></div>
    </div>

    <!-- CHAPTER MANAGEMENT -->
    <div class="card">
      <h2>Manage Chapters</h2>
      <div class="small">
        पहले Subject चुनें। उसके Chapters यहाँ दिखाई देंगे।
      </div>
      <div id="chapterList">Subject चुनें।</div>
    </div>

    <!-- QUESTIONS -->
    <div class="card">
      <h2>Questions</h2>
      <button type="button" class="primary"
              onclick="loadQuestions()">Refresh Questions</button>
      <div id="questionsList"></div>
    </div>

  </div>
</div>

<script>
"use strict";

/* SUPABASE CONFIG */
const SUPABASE_URL =
  "https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let chapterRequest = 0;
let questionRequest = 0;

/* HELPERS */
function el(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(text,color="green"){
  el("message").textContent = text;
  el("message").style.color = color;
}

function showLoginMessage(text,color="red"){
  el("loginMessage").textContent = text;
  el("loginMessage").style.color = color;
}

/* LOGIN */
async function login(){
  const email = el("email").value.trim();
  const password = el("password").value;
  const button = el("loginButton");

  if(!email || !password){
    showLoginMessage("Email और password भरें।");
    return;
  }

  button.disabled = true;
  showLoginMessage("Login हो रहा है...","blue");

  try{
    const {error} = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    showAdmin();
  }catch(error){
    console.error("Login error:",error);
    showLoginMessage("Login failed: " + error.message);
  }finally{
    button.disabled = false;
  }
}

/* LOGOUT */
async function logout(){
  try{
    const {error} = await supabaseClient.auth.signOut();
    if(error) throw error;

    editingId = null;
    el("adminArea").classList.add("hidden");
    el("loginCard").classList.remove("hidden");
    showLoginMessage("आप logout हो गए हैं।","green");
  }catch(error){
    alert("Logout failed: " + error.message);
  }
}

/* SHOW ADMIN */
function showAdmin(){
  el("loginCard").classList.add("hidden");
  el("adminArea").classList.remove("hidden");

  loadChapters();
  loadQuestions();
}

/* SESSION */
async function checkSession(){
  try{
    const {data,error} = await supabaseClient.auth.getSession();
    if(error) throw error;

    if(data.session){
      showAdmin();
    }
  }catch(error){
    console.error("Session error:",error);
  }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_IN" && session){
    showAdmin();
  }
});

checkSession();

/* LOAD CHAPTERS */
async function loadChapters(){
  const request = ++chapterRequest;
  const subject = el("subject").value;
  const select = el("chapterSelect");
  const container = el("chapterList");

  select.innerHTML = `
    <option value="">Select Chapter</option>
    <option value="__new__">➕ Add New Chapter</option>
  `;

  el("newChapterBox").classList.add("hidden");

  if(!subject){
    container.textContent = "Subject चुनें।";
    return;
  }

  container.textContent = "Chapters loading...";

  try{
    const {data,error} = await supabaseClient
      .from("questions")
      .select("chapter")
      .eq("subject",subject)
      .order("chapter");

    if(error) throw error;
    if(request !== chapterRequest) return;

    const chapters = [...new Set(
      (data || []).map(row => row.chapter).filter(Boolean)
    )];

    chapters.forEach(chapter=>{
      const option = document.createElement("option");
      option.value = chapter;
      option.textContent = chapter;
      select.appendChild(option);
    });

    await renderChapterList(chapters,subject,request);

  }catch(error){
    console.error("Load chapters error:",error);
    if(request === chapterRequest){
      container.textContent = "Chapters load नहीं हुए: " + error.message;
    }
  }
}

/* CHAPTER SELECT */
function chapterChanged(){
  const value = el("chapterSelect").value;

  el("newChapterBox").classList.toggle(
    "hidden",
    value !== "__new__"
  );
}

/* GET CHAPTER */
function getChapterName(){
  const selected = el("chapterSelect").value;

  if(selected === "__new__"){
    return el("newChapter").value.trim();
  }

  return selected.trim();
}

/* ADD / UPDATE QUESTION */
async function saveQuestion(){
  const subject = el("subject").value;
  const chapter = getChapterName();
  const question = el("question").value.trim();

  const option_a = el("option_a").value.trim();
  const option_b = el("option_b").value.trim();
  const option_c = el("option_c").value.trim();
  const option_d = el("option_d").value.trim();
  const correct_answer = Number(el("correct_answer").value);

  if(!subject || !chapter || !question ||
     !option_a || !option_b || !option_c || !option_d){
    showMessage("सभी fields भरें।","red");
    return;
  }

  const questionData = {
    subject,
    chapter,
    question,
    option_a,
    option_b,
    option_c,
    option_d,
    correct_answer
  };

  const button = el("saveButton");
  button.disabled = true;

  try{
    if(editingId !== null){
      const {data,error} = await supabaseClient
        .from("questions")
        .update(questionData)
        .eq("id",editingId)
        .select("id");

      if(error) throw error;
      if(!data || !data.length){
        throw new Error("Question update नहीं हुआ। Permissions जाँचें।");
      }

      editingId = null;
      resetEditUI();
      clearQuestionFields();
      showMessage("Question updated successfully.");
    }else{
      const {error} = await supabaseClient
        .from("questions")
        .insert([questionData]);

      if(error) throw error;

      showMessage("Question successfully added.");
      clearQuestionFields();
    }

    await loadChapters();
    await loadQuestions();

    if(el("chapterSelect").querySelector(
      `option[value="${CSS.escape(chapter)}"]`
    )){
      el("chapterSelect").value = chapter;
    }

  }catch(error){
    console.error("Save question error:",error);
    showMessage("Save failed: " + error.message,"red");
  }finally{
    button.disabled = false;
  }
}

/* CLEAR QUESTION FIELDS */
function clearQuestionFields(){
  el("question").value = "";
  el("option_a").value = "";
  el("option_b").value = "";
  el("option_c").value = "";
  el("option_d").value = "";
  el("correct_answer").value = "0";
}

/* RESET EDIT UI */
function resetEditUI(){
  el("formTitle").textContent = "Add Question";
  el("saveButton").textContent = "Add Question";
  el("cancelButton").classList.add("hidden");
}

/* RENDER CHAPTER LIST */
async function renderChapterList(chapters,subject,request){
  const container = el("chapterList");
  container.replaceChildren();

  if(!chapters.length){
    container.textContent = "No chapters found.";
    return;
  }

  for(const chapter of chapters){
    if(request !== chapterRequest) return;

    const box = document.createElement("div");
    box.className = "chapter-box";

    const title = document.createElement("div");
    title.className = "chapter-name";
    title.textContent = chapter;

    const countElement = document.createElement("div");
    countElement.className = "small";
    countElement.textContent = "Questions loading...";

    const buttons = document.createElement("div");
    buttons.className = "buttons";

    const renameButton = document.createElement("button");
    renameButton.type = "button";
    renameButton.className = "warning";
    renameButton.textContent = "✏️ Rename";

    /* Direct event binding avoids inline onclick issues */
    renameButton.addEventListener("click",()=>{
      renameChapter(chapter);
    });

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "danger";
    deleteButton.textContent = "🗑️ Delete Chapter";

    deleteButton.addEventListener("click",()=>{
      deleteChapter(chapter);
    });

    buttons.append(renameButton,deleteButton);
    box.append(title,countElement,buttons);
    container.appendChild(box);

    try{
      const {count,error} = await supabaseClient
        .from("questions")
        .select("id",{count:"exact",head:true})
        .eq("subject",subject)
        .eq("chapter",chapter);

      if(error) throw error;

      countElement.textContent = `${count ?? 0} question(s)`;
    }catch(error){
      console.error("Chapter count error:",error);
      countElement.textContent = "Count load नहीं हुआ";
    }
  }
}

/* RENAME CHAPTER */
async function renameChapter(oldName){
  const subject = el("subject").value;

  if(!subject || !oldName){
    alert("पहले Subject चुनें।");
    return;
  }

  const input = prompt(
    `"${oldName}" का नया नाम लिखें:`,
    oldName
  );

  if(input === null) return;

  const newName = input.trim();

  if(!newName){
    alert("Chapter name खाली नहीं हो सकता।");
    return;
  }

  if(newName === oldName) return;

  try{
    const {data:existing,error:checkError} = await supabaseClient
      .from("questions")
      .select("id")
      .eq("subject",subject)
      .eq("chapter",newName)
      .limit(1);

    if(checkError) throw checkError;

    if(existing && existing.length){
      alert("यह chapter name पहले से मौजूद है।");
      return;
    }

    const {data,error} = await supabaseClient
      .from("questions")
      .update({chapter:newName})
      .eq("subject",subject)
      .eq("chapter",oldName)
      .select("id");

    if(error) throw error;

    if(!data || !data.length){
      alert(
        "कोई question update नहीं हुआ। " +
        "Supabase UPDATE/SELECT RLS policies जाँचें।"
      );
      return;
    }

    alert(
      `Chapter rename हो गया। ${data.length} questions update हुए।`
    );

    await loadChapters();
    await loadQuestions();

  }catch(error){
    console.error("Rename chapter error:",error);
    alert("Rename failed: " + error.message);
  }
}

/* DELETE CHAPTER */
async function deleteChapter(chapter){
  const subject = el("subject").value;

  if(!subject || !chapter){
    alert("पहले Subject चुनें।");
    return;
  }

  try{
    const {count,error:countError} = await supabaseClient
      .from("questions")
      .select("id",{count:"exact",head:true})
      .eq("subject",subject)
      .eq("chapter",chapter);

    if(countError) throw countError;

    const total = count || 0;

    if(total === 0){
      alert("इस chapter में कोई question नहीं मिला।");
      return;
    }

    const ok = confirm(
      `क्या आप "${chapter}" delete करना चाहते हैं?\n\n` +
      `इसमें ${total} questions हैं।\n` +
      "इसके सभी questions delete हो जाएंगे।"
    );

    if(!ok) return;

    const {data,error} = await supabaseClient
      .from("questions")
      .delete()
      .eq("subject",subject)
      .eq("chapter",chapter)
      .select("id");

    if(error) throw error;

    if(!data || !data.length){
      alert(
        "कोई question delete नहीं हुआ। " +
        "Supabase DELETE/SELECT RLS policies जाँचें।"
      );
      return;
    }

    alert(`${data.length} questions delete हो गए।`);

    await loadChapters();
    await loadQuestions();

  }catch(error){
    console.error("Delete chapter error:",error);
    alert("Delete failed: " + error.message);
  }
}

/* LOAD QUESTIONS */
async function loadQuestions(){
  const request = ++questionRequest;
  const list = el("questionsList");

  list.textContent = "Questions loading...";

  try{
    const {data,error} = await supabaseClient
      .from("questions")
      .select("*")
      .order("subject")
      .order("chapter")
      .order("id");

    if(error) throw error;
    if(request !== questionRequest) return;

    if(!data || !data.length){
      list.textContent = "अभी कोई question नहीं है।";
      return;
    }

    list.replaceChildren();

    data.forEach(item=>{
      const box = document.createElement("div");
      box.className = "question-box";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${item.subject} — ${item.chapter}`;

      const questionText = document.createElement("div");
      questionText.className = "question-text";
      questionText.textContent = item.question;

      box.append(meta,questionText);

      ["option_a","option_b","option_c","option_d"].forEach(
        (key,index)=>{
          const line = document.createElement("div");
          line.textContent = `${"ABCD"[index]}. ${item[key]}`;
          box.appendChild(line);
        }
      );

      const correct = document.createElement("div");
      correct.style.cssText = "margin-top:8px;font-weight:bold;";
      correct.textContent =
        "Correct Answer: " + ("ABCD"[Number(item.correct_answer)] || "Unknown");
      box.appendChild(correct);

      const buttons = document.createElement("div");
      buttons.className = "buttons";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "primary";
      editButton.textContent = "✏️ Edit";
      editButton.addEventListener("click",()=>{
        editQuestion(item.id);
      });

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "danger";
      deleteButton.textContent = "🗑️ Delete";
      deleteButton.addEventListener("click",()=>{
        deleteQuestion(item.id);
      });

      buttons.append(editButton,deleteButton);
      box.appendChild(buttons);
      list.appendChild(box);
    });

  }catch(error){
    console.error("Load questions error:",error);
    if(request === questionRequest){
      list.textContent = "Error: " + error.message;
    }
  }
}

/* EDIT QUESTION */
async function editQuestion(id){
  try{
    const {data,error} = await supabaseClient
      .from("questions")
      .select("*")
      .eq("id",id)
      .single();

    if(error) throw error;

    editingId = id;
    el("subject").value = data.subject;

    await loadChapters();

    el("chapterSelect").value = data.chapter;
    chapterChanged();

    el("question").value = data.question;
    el("option_a").value = data.option_a;
    el("option_b").value = data.option_b;
    el("option_c").value = data.option_c;
    el("option_d").value = data.option_d;
    el("correct_answer").value = String(data.correct_answer);

    el("formTitle").textContent = "Edit Question";
    el("saveButton").textContent = "Update Question";
    el("cancelButton").classList.remove("hidden");

    window.scrollTo({top:0,behavior:"smooth"});

  }catch(error){
    console.error("Edit question error:",error);
    alert("Question load नहीं हुआ: " + error.message);
  }
}

/* CANCEL EDIT */
function cancelEdit(){
  editingId = null;
  resetEditUI();
  clearQuestionFields();
  el("newChapter").value = "";
  el("newChapterBox").classList.add("hidden");
  showMessage("");
}

/* DELETE QUESTION */
async function deleteQuestion(id){
  if(!confirm("क्या आप यह question delete करना चाहते हैं?")){
    return;
  }

  try{
    const {data,error} = await supabaseClient
      .from("questions")
      .delete()
      .eq("id",id)
      .select("id");

    if(error) throw error;

    if(!data || !data.length){
      throw new Error(
        "Question delete नहीं हुआ। Supabase RLS policies जाँचें।"
      );
    }

    alert("Question deleted.");

    if(editingId === id){
      cancelEdit();
    }

    await loadQuestions();
    await loadChapters();

  }catch(error){
    console.error("Delete question error:",error);
    alert("Delete failed: " + error.message);
  }
}
</script>

</body>
</html>
