<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSEB Quiz 12th | Bihar Board Class 12 Quiz</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f8fc;
  color:#12345b;
}

/* ================= HEADER ================= */

header{
  background:#073b78;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.navbar{
  max-width:1200px;
  margin:auto;
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.logo{
  width:58px;
  height:58px;
  border:3px solid #ffd21c;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,210,28,.15);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.brand-text h1{
  font-size:27px;
  color:white;
}

.brand-text h1 span{
  color:#ffd21c;
}

.brand-text p{
  font-size:13px;
  margin-top:3px;
  color:#e4efff;
}

.nav-links{
  display:flex;
  gap:8px;
  align-items:center;
}

.nav-links button{
  border:0;
  background:transparent;
  color:white;
  font-size:15px;
  padding:10px 13px;
  cursor:pointer;
  border-radius:7px;
}

.nav-links button:hover{
  background:rgba(255,255,255,.12);
  color:#ffd21c;
}

/* ================= HERO ================= */

.hero{
  background:linear-gradient(135deg,#eaf5ff,#ffffff);
  padding:55px 20px;
}

.hero-inner{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:35px;
}

.hero-small{
  color:#0d5ca8;
  font-weight:bold;
  font-size:18px;
  margin-bottom:12px;
}

.hero h2{
  font-size:48px;
  line-height:1.1;
  color:#073b78;
  margin-bottom:15px;
}

.hero h2 span{
  color:#f2b900;
}

.hero p{
  font-size:19px;
  line-height:1.6;
  color:#385878;
  max-width:650px;
}

.hero-tag{
  display:inline-block;
  margin:20px 0;
  background:#ffd21c;
  color:#073b78;
  padding:11px 25px;
  border-radius:30px;
  font-weight:bold;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
  padding:13px 23px;
  border-radius:28px;
  border:none;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.primary-btn{
  background:#073b78;
  color:white;
}

.secondary-btn{
  background:#ffd21c;
  color:#073b78;
}

.primary-btn:hover,
.secondary-btn:hover{
  transform:translateY(-2px);
}

.hero-books{
  min-height:320px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.book-stack{
  width:300px;
}

.book{
  height:48px;
  border-radius:8px;
  margin:7px 0;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 4px 8px rgba(0,0,0,.15);
}

.book:nth-child(1){background:#1264ad;}
.book:nth-child(2){background:#8e38bb;}
.book:nth-child(3){background:#159447;}
.book:nth-child(4){background:#e92c57;}
.book:nth-child(5){background:#ef9017;}
.book:nth-child(6){background:#159fb1;}

/* ================= SECTION ================= */

.section{
  padding:55px 20px;
}

.section-inner{
  max-width:1200px;
  margin:auto;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  color:#073b78;
  font-size:34px;
  margin-bottom:8px;
}

.section-title p{
  color:#5c7189;
}

/* ================= SUBJECT ================= */

.subject-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
}

.subject-card{
  border:0;
  min-height:190px;
  border-radius:15px;
  color:white;
  padding:22px 12px;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(0,0,0,.13);
  transition:.2s;
}

.subject-card:hover{
  transform:translateY(-6px);
}

.subject-icon{
  font-size:43px;
  margin-bottom:12px;
}

.subject-card h3{
  font-size:20px;
  margin-bottom:7px;
}

.subject-card p{
  font-size:13px;
}

.physics{background:#1673d1;}
.chemistry{background:#943ac0;}
.maths{background:#159447;}
.biology{background:#e82e59;}
.hindi{background:#ef8d16;}
.english{background:#159fb1;}

/* ================= FEATURES ================= */

.features{
  background:#eaf5ff;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.feature{
  text-align:center;
  padding:20px;
  border-right:1px solid #cbdceb;
}

.feature:last-child{
  border-right:none;
}

.feature-icon{
  font-size:38px;
  margin-bottom:12px;
}

.feature h3{
  color:#073b78;
  margin-bottom:8px;
  font-size:17px;
}

.feature p{
  color:#58718c;
  font-size:14px;
  line-height:1.5;
}

/* ================= LOGIN ================= */

#authArea{
  display:none;
  min-height:calc(100vh - 78px);
  padding:40px 15px;
  background:linear-gradient(135deg,#eaf5ff,#ffffff);
}

.auth-box{
  max-width:430px;
  margin:30px auto;
  background:white;
  padding:30px 25px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.auth-logo{
  width:85px;
  height:85px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #ffd21c;
  margin:0 auto 15px;
}

.auth-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.auth-box h2{
  text-align:center;
  color:#073b78;
  margin-bottom:7px;
}

.auth-subtitle{
  text-align:center;
  color:#718399;
  margin-bottom:25px;
}

.auth-input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:2px solid #dce5ef;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

.auth-input:focus{
  border-color:#0b61a9;
}

.auth-main-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#073b78;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.auth-secondary-btn{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#ffd21c;
  color:#073b78;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.auth-message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:#58718c;
}

.auth-switch button{
  border:0;
  background:none;
  color:#0b61a9;
  font-weight:bold;
  cursor:pointer;
}

/* ================= USER BAR ================= */

.user-bar{
  max-width:1200px;
  margin:0 auto 20px;
  background:white;
  border-radius:12px;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.user-info{
  color:#073b78;
  font-weight:bold;
}

.logout-btn{
  border:0;
  background:#ffe2e2;
  color:#a51e1e;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= CHAPTER ================= */

#chapterArea{
  display:none;
  background:#f4f8fc;
  min-height:calc(100vh - 78px);
}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

.chapter-btn{
  border:2px solid #d6e4f1;
  background:white;
  color:#073b78;
  padding:20px 15px;
  border-radius:12px;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
  transition:.2s;
}

.chapter-btn:hover{
  background:#073b78;
  color:white;
  transform:translateY(-3px);
}

/* ================= QUIZ ================= */

#quizArea{
  display:none;
  background:#f4f8fc;
  min-height:calc(100vh - 78px);
}

.quiz-box{
  max-width:850px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.quiz-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.quiz-info{
  background:#edf5ff;
  padding:8px 13px;
  border-radius:20px;
  font-size:14px;
}

.progress{
  height:9px;
  background:#e1e8f0;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#0b61a9;
  transition:.3s;
}

/* QUESTION CARD */

.question-card{
  background:linear-gradient(135deg,#ffffff,#f7fbff);
  border:1px solid #dbe8f5;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(7,59,120,.06);
}

.question-label{
  display:inline-block;
  background:#073b78;
  color:white;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  margin-bottom:14px;
  font-weight:bold;
}

.question{
  font-size:21px;
  font-weight:bold;
  line-height:1.55;
  color:#153e68;
  overflow-wrap:anywhere;
}

/* OPTIONS */

.option{
  width:100%;
  text-align:left;
  padding:15px 16px;
  margin:9px 0;
  border:2px solid #dce5ef;
  border-radius:11px;
  background:white;
  color:#173d62;
  cursor:pointer;
  font-size:16px;
  overflow-wrap:anywhere;
  transition:.15s;
}

.option:hover{
  background:#f0f7ff;
  border-color:#a9c9e8;
}

.option.correct{
  background:#d8f7df;
  border-color:#22a447;
  color:#146c2d;
}

.option.wrong{
  background:#ffe0e0;
  border-color:#dc3030;
  color:#a31919;
}

/* 50-50 */

.lifeline-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:18px 0;
  padding:12px;
  border-radius:12px;
  background:#fff8d9;
  border:1px solid #f1d75a;
}

.lifeline-info{
  color:#735d00;
  font-size:14px;
  font-weight:bold;
}

.fifty-btn{
  border:0;
  background:#efb900;
  color:#073b78;
  padding:11px 17px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.fifty-btn:hover{
  transform:translateY(-1px);
}

.fifty-btn:disabled{
  background:#c9c9c9;
  color:#666;
  cursor:not-allowed;
}

/* NAV BUTTONS */

.quiz-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-top:18px;
}

.next-btn{
  background:#073b78;
  color:white;
  border:0;
  padding:13px 25px;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.back-btn{
  background:#edf2f7;
  color:#173d62;
  border:0;
  padding:11px 18px;
  border-radius:22px;
  cursor:pointer;
  margin-bottom:20px;
}

/* RESULT */

#resultBox{
  display:none;
  text-align:center;
  padding:30px 10px;
}

.result-circle{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#073b78;
  color:white;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
  border:6px solid #ffd21c;
}

/* ================= ABOUT ================= */

.about{
  background:#073b78;
  color:white;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  gap:35px;
  align-items:center;
}

.about-visual{
  text-align:center;
  font-size:80px;
}

.about h2{
  font-size:30px;
  margin-bottom:12px;
}

.about p{
  line-height:1.7;
  color:#e5effb;
}

.creator{
  display:inline-block;
  margin-top:15px;
  background:#ffd21c;
  color:#073b78;
  padding:10px 20px;
  border-radius:25px;
  font-weight:bold;
}

.contact-box{
  background:rgba(255,255,255,.09);
  padding:22px;
  border-radius:12px;
}

.contact-box h3{
  margin-bottom:15px;
}

.contact-box p{
  margin:9px 0;
}

/* ================= FOOTER ================= */

footer{
  background:#052d5b;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer strong{
  color:#ffd21c;
}

.footer-links{
  margin-top:12px;
}

.footer-links button{
  background:none;
  border:0;
  color:white;
  margin:0 8px;
  cursor:pointer;
}

.footer-links button:hover{
  color:#ffd21c;
}

/* ================= MOBILE ================= */

@media(max-width:950px){

  .subject-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .feature-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .feature{
    border-right:none;
  }

  .about-grid{
    grid-template-columns:1fr;
    text-align:center;
  }

  .contact-box{
    max-width:500px;
    margin:auto;
    text-align:left;
  }
}

@media(max-width:700px){

  .navbar{
    padding:10px 12px;
  }

  .brand-text h1{
    font-size:21px;
  }

  .brand-text p{
    font-size:11px;
  }

  .logo{
    width:50px;
    height:50px;
  }

  .nav-links{
    display:none;
  }

  .hero{
    padding:40px 15px;
  }

  .hero-inner{
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero h2{
    font-size:35px;
  }

  .hero p{
    font-size:16px;
  }

  .hero-buttons{
    justify-content:center;
  }

  .hero-books{
    min-height:230px;
  }

  .book-stack{
    width:250px;
  }

  .subject-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .subject-card{
    min-height:160px;
  }

  .section{
    padding:40px 14px;
  }

  .section-title h2{
    font-size:28px;
  }

  .feature-grid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

  .option{
    font-size:15px;
  }

  .quiz-box{
    padding:17px;
  }

  .lifeline-box{
    align-items:flex-start;
    flex-direction:column;
  }

  .fifty-btn{
    width:100%;
  }

  .quiz-actions{
    flex-direction:column;
  }

  .next-btn{
    width:100%;
  }

  .user-bar{
    flex-direction:column;
    align-items:stretch;
  }

  .logout-btn{
    width:100%;
  }
}

@media(max-width:420px){

  .subject-grid{
    grid-template-columns:1fr;
  }

  .subject-card{
    min-height:140px;
  }

  .hero h2{
    font-size:30px;
  }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="navbar">

    <div class="brand" onclick="goHome()">

      <div class="logo">
        <img
          src="IMG_20250914_190850.jpg"
          alt="BSEB Quiz 12th"
        >
      </div>

      <div class="brand-text">
        <h1>BSEB <span>Quiz 12th</span></h1>
        <p>Study • Practice • Score High</p>
      </div>

    </div>

    <div class="nav-links">

      <button onclick="goHome()">🏠 Home</button>
      <button onclick="openLogin()">🔐 Login</button>
      <button onclick="scrollToAbout()">ℹ️ About</button>
      <button onclick="scrollToContact()">✉️ Contact</button>

    </div>

  </div>

</header>


<!-- ================= HOME ================= -->

<div id="homeContent">

<section class="hero" id="home">

  <div class="hero-inner">

    <div>

      <div class="hero-small">
        Bihar Board Class 12
      </div>

      <h2>
