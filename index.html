<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_c";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
VARIABLES
========================================================= */

let currentUser = null;

let selectedSubject = "";

let selectedChapter = "";

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let fiftyUsed = 0;

const MAX_FIFTY = 10;

let lastResult = null;


/* =========================================================
AUTH UI
========================================================= */

function showLoginForm(){

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("signupForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

  setAuthMessage("");

}


function showSignupForm(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")
    .classList.remove("hidden");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("signupTab")
    .classList.add("active");

  setAuthMessage("");

}


function setAuthMessage(
  text,
  color="#dc3545"
){

  const el =
    document.getElementById(
      "authMessage"
    );

  el.textContent = text;

  el.style.color = color;

}


/* =========================================================
MOBILE CLEAN
========================================================= */

function cleanMobile(value){

  return String(value || "")
    .replace(/\D/g,"")
    .slice(0,10);

}


/* =========================================================
SIGNUP
========================================================= */

async function signupUser(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const mobile =
    cleanMobile(
      document
        .getElementById("signupMobile")
        .value
    );


  if(!name){

    setAuthMessage(
      "Please apna name enter karein."
    );

    return;

  }


  if(mobile.length !== 10){

    setAuthMessage(
      "10 digit mobile number enter karein."
    );

    return;

  }


  setAuthMessage(
    "Account create ho raha hai...",
    "#0d63a9"
  );


  /* Check existing mobile */

  const {
    data:existing,
    error:checkError
  } =
    await supabaseClient
      .from("user_accounts")
      .select("id,name,mobile")
      .eq("mobile",mobile)
      .maybeSingle();


  if(checkError){

    setAuthMessage(
      "Account check failed: "+
      checkError.message
    );

    return;

  }


  if(existing){

    setAuthMessage(
      "Ye mobile number already registered hai. Login karein."
    );

    document
      .getElementById("loginName")
      .value=existing.name;

    document
      .getElementById("loginMobile")
      .value=existing.mobile;

    showLoginForm();

    return;

  }


  /* Create account */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_accounts")
      .insert({
        name:name,
        mobile:mobile
      })
      .select()
      .single();


  if(error){

    setAuthMessage(
      "Account create nahi hua: "+
      error.message
    );

    return;

  }


  currentUser = data;


  /* Save local session */

  localStorage.setItem(
    "quiz_current_user",
    JSON.stringify(data)
  );


  saveUserName(name);


  setAuthMessage(
    "Account created! Home open ho raha hai...",
    "#198754"
  );


  setTimeout(function(){

    openWebsite();

  },500);

}


/* =========================================================
LOGIN
========================================================= */

async function loginUser(){

  const name =
    document
      .getElementById("loginName")
      .value
      .trim();

  const mobile =
    cleanMobile(
      document
        .getElementById("loginMobile")
        .value
    );


  if(!name){

    setAuthMessage(
      "Name enter karein."
    );

    return;

  }


  if(mobile.length !== 10){

    setAuthMessage(
      "10 digit mobile number enter karein."
    );

    return;

  }


  setAuthMessage(
    "Login ho raha hai...",
    "#0d63a9"
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_accounts")
      .select("*")
      .eq("mobile",mobile)
      .maybeSingle();


  if(error){

    setAuthMessage(
      "Login failed: "+
      error.message
    );

    return;

  }


  if(!data){

    setAuthMessage(
      "Account nahi mila. Pehle Create Account karein."
    );

    return;

  }


  /* Name check */

  if(
    data.name.trim().toLowerCase() !==
    name.trim().toLowerCase()
  ){

    setAuthMessage(
      "Name aur mobile number match nahi kar rahe."
    );

    return;

  }


  currentUser = data;


  localStorage.setItem(
    "quiz_current_user",
    JSON.stringify(data)
  );


  saveUserName(data.name);


  setAuthMessage(
    "Login successful! Home open ho raha hai...",
    "#198754"
  );


  setTimeout(function(){

    openWebsite();

  },300);

}


/* =========================================================
LOGOUT
========================================================= */

function logoutUser(){

  currentUser=null;

  localStorage.removeItem(
    "quiz_current_user"
  );


  document
    .getElementById("website")
    .classList.add("hidden");


  document
    .getElementById("authPage")
    .classList.remove("hidden");


  document
    .getElementById("loginName")
    .value="";


  document
    .getElementById("loginMobile")
    .value="";


  showLoginForm();

}


/* =========================================================
OPEN WEBSITE
========================================================= */

function openWebsite(){

  document
    .getElementById("authPage")
    .classList.add("hidden");


  document
    .getElementById("website")
    .classList.remove("hidden");


  loadCurrentUser();

  showHome();

}


/* =========================================================
SESSION CHECK
========================================================= */

function checkSession(){

  const saved =
    localStorage.getItem(
      "quiz_current_user"
    );


  if(!saved){

    document
      .getElementById("authPage")
      .classList.remove("hidden");

    return;

  }


  try{

    currentUser =
      JSON.parse(saved);


    if(
      !currentUser ||
      !currentUser.id
    ){

      throw new Error(
        "Invalid session"
      );

    }


    openWebsite();

  }catch(error){

    localStorage.removeItem(
      "quiz_current_user"
    );


    document
      .getElementById("authPage")
      .classList.remove("hidden");

  }

}


/* =========================================================
USER NAME
========================================================= */

function saveUserName(name){

  if(!currentUser)return;


  localStorage.setItem(
    "quiz_name_"+currentUser.id,
    name
  );

}


function getUserName(){

  if(!currentUser){

    return "Student";

  }


  const saved =
    localStorage.getItem(
      "quiz_name_"+currentUser.id
    );


  if(saved){

    return saved;

  }


  return (
    currentUser.name ||
    "Student"
  );

}


/* =========================================================
USER DATA / PROFILE
========================================================= */

function loadCurrentUser(){

  if(!currentUser)return;


  const name =
    getUserName();


  const mobile =
    currentUser.mobile || "";


  document
    .getElementById("profileName")
    .textContent=name;


  const mobileElement =
    document.getElementById(
      "profileMobile"
    );


  if(mobileElement){

    mobileElement.textContent =
      "Mobile: "+mobile;

  }


  const letter =
    name
      .charAt(0)
      .toUpperCase() || "U";


  document
    .getElementById(
      "profilePhotoLetter"
    )
    .textContent=letter;


  document
    .getElementById(
      "miniUserLetter"
    )
    .textContent=letter;


  loadProfilePhoto();

}


/* =========================================================
PROFILE PHOTO
========================================================= */

function saveProfilePhoto(event){

  const file =
    event.target.files[0];


  if(
    !file ||
    !currentUser
  ){

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    alert(
      "Please image file select karein."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    const imageData =
      e.target.result;


    localStorage.setItem(
      "quiz_photo_"+currentUser.id,
      imageData
    );


    loadProfilePhoto();

  };


  reader.readAsDataURL(file);

}


function loadProfilePhoto(){

  if(!currentUser)return;


  const imageData =
    localStorage.getItem(
      "quiz_photo_"+currentUser.id
    );


  const profileImage =
    document.getElementById(
      "profileImage"
    );


  const logoImage =
    document.getElementById(
      "logoImage"
    );


  const miniImage =
    document.getElementById(
      "miniUserImage"
    );


  const profileLetter =
    document.getElementById(
      "profilePhotoLetter"
    );


  const logoText =
    document.getElementById(
      "logoText"
    );


  const miniLetter =
    document.getElementById(
      "miniUserLetter"
    );


  if(imageData){

    profileImage.src=imageData;

    profileImage.style.display=
      "block";


    logoImage.src=imageData;

    logoImage.style.display=
      "block";


    miniImage.src=imageData;

    miniImage.style.display=
      "block";


    profileLetter.style.display=
      "none";


    logoText.style.display=
      "none";


    miniLetter.style.display=
      "none";

  }else{

    profileImage.style.display=
      "none";


    logoImage.style.display=
      "none";


    miniImage.style.display=
      "none";


    profileLetter.style.display=
      "block";


    logoText.style.display=
      "block";


    miniLetter.style.display=
      "block";

  }

}


/* =========================================================
PAGE NAVIGATION
========================================================= */

function hideAllPages(){

  document
    .getElementById("homePage")
    .classList.add("hidden");


  document
    .getElementById("chapterPage")
    .classList.add("hidden");


  document
    .getElementById("quizPage")
    .classList.add("hidden");


  document
    .getElementById("profilePage")
    .classList.add("hidden");


  document
    .getElementById("certificatePage")
    .classList.add("hidden");

}


function showHome(){

  hideAllPages();


  document
    .getElementById("homePage")
    .classList.remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function openSubjects(){

  showHome();


  setTimeout(function(){

    document
      .getElementById("subjectsSection")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  },100);

}


function showProfile(){

  hideAllPages();


  document
    .getElementById("profilePage")
    .classList.remove("hidden");


  loadCurrentUser();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
SUBJECT
========================================================= */

async function selectSubject(subject){

  selectedSubject=subject;


  hideAllPages();


  document
    .getElementById("chapterPage")
    .classList.remove("hidden");


  document
    .getElementById("chapterPageTitle")
    .textContent=
    subject+" — Select Chapter";


  document
    .getElementById("chapterGrid")
    .innerHTML="";


  document
    .getElementById("chapterLoading")
    .classList.remove("hidden");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("questions")
      .select("chapter")
      .eq("subject",subject);


  document
    .getElementById("chapterLoading")
    .classList.add("hidden");


  if(error){

    document
      .getElementById("chapterGrid")
      .innerHTML=
      "<p>Chapter load nahi ho paaya: "+
      escapeHtml(error.message)+
      "</p>";

    return;

  }


  const chapters=[
    ...new Set(
      (data||[])
        .map(
          item=>item.chapter
        )
        .filter(
          chapter =>
            chapter &&
            String(chapter).trim()!=""
        )
    )
  ];


  if(!chapters.length){

    document
      .getElementById("chapterGrid")
      .innerHTML=
      "<p>Is subject me abhi questions available nahi hain.</p>";

    return;

  }


  chapters.forEach(
    function(chapter,index){

      createChapterCard(
        chapter,
        index+1
      );

    }
  );

}


function createChapterCard(
  chapter,
  number
){

  const card =
    document.createElement(
      "button"
    );


  card.type="button";

  card.className=
    "chapter-card";


  card.innerHTML=`

    <div class="chapter-number">
      CHAPTER ${number}
    </div>

    <div class="chapter-name">
      ${escapeHtml(chapter)}
    </div>

    <div class="chapter-count">
      Questions available
    </div>

  `;


  card.onclick=function(){

    selectChapter(chapter);

  };


  document
    .getElementById("chapterGrid")
    .appendChild(card);

}


/* =========================================================
CHAPTER
========================================================= */

async function selectChapter(chapter){

  selectedChapter=chapter;


  hideAllPages();


  document
    .getElementById("quizPage")
    .classList.remove("hidden");


  document
    .getElementById("quizCard")
    .classList.remove("hidden");


  document
    .getElementById("resultCard")
    .classList.add("hidden");


  document
    .getElementById("questionText")
    .textContent=
    "Questions loading...";


  document
    .getElementById("options")
    .innerHTML="";


  document
    .getElementById("nextButton")
    .classList.add("hidden");


  document
    .getElementById("fiftyButton")
    .classList.remove("used");


  fiftyUsed=0;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("questions")
      .select("*")
      .eq("subject",selectedSubject)
      .eq("chapter",selectedChapter)
      .order("id",{ascending:true});


  if(error){

    document
      .getElementById("questionText")
      .textContent=
      "Questions load nahi ho paaye: "+
      error.message;

    return;

  }


  questions=data || [];


  if(!questions.length){

    document
      .getElementById("questionText")
      .textContent=
      "Is chapter me abhi questions available nahi hain.";

    return;

  }


  currentQuestion=0;

  score=0;

  answered=false;

  fiftyUsed=0;


  document
    .getElementById("quizSubjectBadge")
    .textContent=
    selectedSubject;


  document
    .getElementById("quizChapterBadge")
    .textContent=
    selectedChapter;


  showQuestion();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
SHOW QUESTION
========================================================= */

function showQuestion(){

  answered=false;


  const q =
    questions[currentQuestion];


  document
    .getElementById("quizQuestionBadge")
    .textContent=
    "Question "+
    (currentQuestion+1)+
    " / "+
    questions.length;


  document
    .getElementById("questionText")
    .textContent=
    q.question;


  const progress =
    ((currentQuestion+1)/
    questions.length)*100;


  document
    .getElementById("progressBar")
    .style.width=
    progress+"%";


  const optionsContainer =
    document.getElementById(
      "options"
    );


  optionsContainer.innerHTML="";


  const optionTexts=[
    q.option_a,
    q.option_b,
    q.option_c,
    q.option_d
  ];


  optionTexts.forEach(
    function(text,index){

      const button =
        document.createElement(
          "button"
        );


      button.type="button";

      button.className="option";

      button.dataset.index=index;


      button.innerHTML=
        "<strong>"+
        String.fromCharCode(
          65+index
        )+
        ".</strong> "+
        escapeHtml(text);


      button.onclick=function(){

        checkAnswer(
          index,
          button
        );

      };


      optionsContainer.appendChild(
        button
      );

    }
  );


  document
    .getElementById("nextButton")
    .classList.add("hidden");


  const fiftyButton =
    document.getElementById(
      "fiftyButton"
    );


  fiftyButton.classList.remove(
    "used"
  );


  fiftyButton.disabled=false;


  if(
    fiftyUsed>=MAX_FIFTY
  ){

    fiftyButton.classList.add(
      "used"
    );

    fiftyButton.disabled=true;

  }


  updateFiftyInfo();

}


/* =========================================================
50/50
========================================================= */

function useFiftyFifty(){

  if(answered)return;


  if(
    fiftyUsed>=MAX_FIFTY
  ){

    return;

  }


  const q =
    questions[currentQuestion];


  const correctIndex =
    Number(q.correct_answer);


  const buttons=[
    ...document.querySelectorAll(
      ".option"
    )
  ];


  const wrongIndexes =
    buttons
      .map(
        button =>
          Number(button.dataset.index)
      )
      .filter(
        index =>
          index!==correctIndex
      );


  wrongIndexes.sort(
    ()=>Math.random()-.5
  );


  const removeIndexes =
    wrongIndexes.slice(0,2);


  removeIndexes.forEach(
    function(index){

      buttons[index].style.visibility=
        "hidden";

      buttons[index].style.pointerEvents=
        "none";

    }
  );


  fiftyUsed++;


  updateFiftyInfo();


  if(
    fiftyUsed>=MAX_FIFTY
  ){

    const button =
      document.getElementById(
        "fiftyButton"
      );


    button.disabled=true;

    button.classList.add(
      "used"
    );

  }

}


function updateFiftyInfo(){

  const remaining =
    Math.max(
      0,
      MAX_FIFTY-fiftyUsed
    );


  document
    .getElementById("lifelineInfo")
    .textContent=
    "50/50 remaining: "+
    remaining+
    " / "+
    MAX_FIFTY;

}


/* =========================================================
CHECK ANSWER
========================================================= */

function checkAnswer(
  selectedIndex,
  selectedButton
){

  if(answered)return;


  answered=true;


  const q =
    questions[currentQuestion];


  const correctIndex =
    Number(q.correct_answer);


  const buttons =
    document.querySelectorAll(
      ".option"
    );


  buttons.forEach(
    function(button,index){

      button.disabled=true;

      button.style.visibility=
        "visible";

      button.style.pointerEvents=
        "none";


      if(
        index===correctIndex
      ){

        button.classList.add(
          "correct"
        );

      }

    }
  );


  if(
    selectedIndex===
    correctIndex
  ){

    score++;

  }else{

    selectedButton.classList.add(
      "wrong"
    );

  }


  document
    .getElementById("nextButton")
    .classList.remove(
      "hidden"
    );

}


/* =========================================================
NEXT QUESTION
========================================================= */

function nextQuestion(){

  if(!answered)return;


  currentQuestion++;


  if(
    currentQuestion>=
    questions.length
  ){

    showResult();

    return;

  }


  showQuestion();

}


/* =========================================================
RESULT
========================================================= */

function showResult(){

  document
    .getElementById("quizCard")
    .classList.add("hidden");


  document
    .getElementById("resultCard")
    .classList.remove("hidden");


  const total =
    questions.length;


  const percentage =
    total
      ? Math.round(
          (score/total)*100
        )
      : 0;


  document
    .getElementById("resultScore")
    .textContent=
    score+" / "+total;


  document
    .getElementById("resultText")
    .textContent=
    "You scored "+
    score+
    " out of "+
    total+
    " ("+
    percentage+
    "%).";


  lastResult={
    subject:selectedSubject,
    chapter:selectedChapter,
    score:score,
    total:total,
    percentage:percentage
  };


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
BACK TO CHAPTER
========================================================= */

function backToChapters(){

  hideAllPages();


  document
    .getElementById("chapterPage")
    .classList.remove("hidden");


  if(selectedSubject){

    selectSubject(
      selectedSubject
    );

  }

}


/* =========================================================
CERTIFICATE
========================================================= */

function showCertificate(){

  if(!lastResult)return;


  hideAllPages();


  document
    .getElementById("certificatePage")
    .classList.remove("hidden");


  const name =
    getUserName();


  document
    .getElementById(
      "certificateName"
    )
    .textContent=
    name;


  document
    .getElementById(
      "certificateChapter"
    )
    .textContent=
    lastResult.subject+
    " — "+
    lastResult.chapter;


  document
    .getElementById(
      "certificateScore"
    )
    .textContent=

    lastResult.score+
    " / "+
    lastResult.total+
    " ("+
    lastResult.percentage+
    "%)";


  document
    .getElementById(
      "certificateDate"
    )
    .textContent=
    new Date().toLocaleDateString(

    );

  });

function backToResult(){

  hideAllPages();


  document
    .getElementById("quizPage")
    .classList.remove("hidden");


  document
    .getElementById("quizCard")
    .classList.add("hidden");


  document
    .getElementById("resultCard")
    .classList.remove("hidden");

}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
START
========================================================= */

window.addEventListener(
  "load",
  function(){

    checkSession();

  }
);

</script>
