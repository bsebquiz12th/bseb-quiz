<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSEB Class 12 Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: lightblue;
            text-align: center;
            padding: 15px;
        }

        .box {
            width: 100%;
            max-width: 650px;
            margin: 15px auto;
            background: white;
            padding: 25px 20px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: darkblue;
            font-size: 28px;
            margin: 5px 0 15px;
        }

        h2 {
            font-size: 22px;
            margin: 10px 0 20px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 560px;
            margin: 12px auto;
            padding: 15px 12px;
            font-size: 18px;
            line-height: 1.4;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.99);
        }

        .subject,
        .chapter-btn {
            background: darkblue;
            color: white;
        }

        .subject:hover,
        .chapter-btn:hover {
            background: blue;
        }

        .question {
            width: 100%;
            background: #f5f7ff;
            border: 2px solid #d8def5;
            border-radius: 12px;
            padding: 18px 15px;
            margin: 15px 0 20px;

            font-size: 20px;
            line-height: 1.6;
            font-weight: bold;

            color: #111;

            /* Long words/text ko screen se bahar nahi jane dega */
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .option {
            background: #eeeeee;
            color: #111;
            border: 2px solid #d5d5d5;
            text-align: left;

            /* Long option bhi phone par wrap hoga */
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .option:hover {
            background: #dddddd;
        }

        .option:disabled {
            cursor: default;
            opacity: 1;
        }

        .correct {
            background: lightgreen !important;
            border: 2px solid green !important;
            color: #064b06 !important;
        }

        .wrong {
            background: #ffb3b3 !important;
            border: 2px solid red !important;
            color: #8b0000 !important;
        }

        .back {
            background: #555;
            color: white;
        }

        .next {
            background: darkblue;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        #progress {
            font-size: 17px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: darkblue;
            margin: 25px 0;
        }

        #message {
            max-width: 650px;
            margin: 10px auto;
            color: red;
            font-weight: bold;
        }

        #chapterList {
            width: 100%;
        }

        #questionBox,
        #optionsBox {
            width: 100%;
        }

        /* -------------------------
           MOBILE FIX
        ------------------------- */

        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            .box {
                margin: 5px auto;
                padding: 20px 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 23px;
            }

            h2 {
                font-size: 19px;
            }

            button {
                width: 100%;
                max-width: none;
                padding: 14px 10px;
                margin: 10px auto;
                font-size: 17px;
            }

            .question {
                font-size: 18px;
                line-height: 1.55;
                padding: 15px 12px;
                margin-top: 12px;
            }

            .option {
                font-size: 17px;
                line-height: 1.45;
                padding: 14px 12px;
            }

            #progress {
                font-size: 15px;
            }

            #score {
                font-size: 22px;
            }
        }

        /* Very small phones */

        @media (max-width: 360px) {

            body {
                padding: 5px;
            }

            .box {
                padding: 16px 9px;
            }

            h1 {
                font-size: 21px;
            }

            .question {
                font-size: 17px;
                padding: 13px 10px;
            }

            .option {
                font-size: 16px;
                padding: 13px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SUBJECT PAGE
    ========================== -->

    <div id="subjectPage" class="box">

        <h1>📚 BSEB Class 12 Quiz</h1>

        <h2>अपना Subject चुनें</h2>

        <button class="subject" data-subject="Physics">
            ⚡ Physics
        </button>

        <button class="subject" data-subject="Chemistry">
            ⚗️ Chemistry
        </button>

        <button class="subject" data-subject="Maths">
            📐 Maths
        </button>

        <button class="subject" data-subject="Biology">
            🧬 Biology
        </button>

        <button class="subject" data-subject="Hindi">
            📖 Hindi
        </button>

        <button class="subject" data-subject="English">
            📘 English
        </button>

    </div>


    <!-- =========================
         CHAPTER PAGE
    ========================== -->

    <div id="chapterPage" class="box hidden">

        <h1 id="chapterTitle">Chapters</h1>

        <div id="chapterList"></div>

        <button id="backToSubjects" class="back">
            ⬅️ Subjects
        </button>

    </div>


    <!-- =========================
         QUIZ PAGE
    ========================== -->

    <div id="quizPage" class="box hidden">

        <h1 id="quizTitle">Quiz</h1>

        <p id="progress"></p>

        <div id="questionBox"></div>

        <div id="optionsBox"></div>

        <button id="nextButton" class="next hidden">
            Next Question ➡️
        </button>

        <button id="backToChapters" class="back">
            ⬅️ Chapters
        </button>

    </div>


    <!-- =========================
         RESULT PAGE
    ========================== -->

    <div id="resultPage" class="box hidden">

        <h1>🎉 Quiz Complete</h1>

        <p id="score"></p>

        <button id="restartButton" class="next">
            🔄 फिर से खेलें
        </button>

        <button id="resultBackButton" class="back">
            ⬅️ Chapters
        </button>

    </div>


    <div id="message"></div>


    <script>

        /* =========================
           SUPABASE
        ========================== */

        const SUPABASE_URL =
            "https://mtykdutibbyufmchaqqj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";


        /* =========================
           QUIZ VARIABLES
        ========================== */

        let selectedSubject = "";
        let selectedChapter = "";

        let questions = [];

        let currentQuestion = 0;
        let score = 0;


        /* =========================
           PAGE FUNCTIONS
        ========================== */

        function hideAllPages() {

            document
                .getElementById("subjectPage")
                .classList.add("hidden");

            document
                .getElementById("chapterPage")
                .classList.add("hidden");

            document
                .getElementById("quizPage")
                .classList.add("hidden");

            document
                .getElementById("resultPage")
                .classList.add("hidden");
        }


        function showSubjects() {

            hideAllPages();

            document
                .getElementById("subjectPage")
                .classList.remove("hidden");

            document
                .getElementById("message")
                .innerText = "";
        }


        function showChapters() {

            hideAllPages();

            document
                .getElementById("chapterPage")
                .classList.remove("hidden");

            loadChapters(selectedSubject);
        }


        /* =========================
           SUBJECT BUTTONS
        ========================== */

        document
            .querySelectorAll(".subject")
            .forEach(button => {

                button.addEventListener("click", function () {

                    selectedSubject =
                        this.dataset.subject;

                    loadChapters(selectedSubject);

                });

            });


        /* =========================
           LOAD CHAPTERS
        ========================== */

        async function loadChapters(subject) {

            hideAllPages();

            document
                .getElementById("chapterPage")
                .classList.remove("hidden");


            document
                .getElementById("chapterTitle")
                .innerText =
                    subject + " - Chapters";


            const chapterList =
                document.getElementById("chapterList");


            chapterList.innerHTML =
                "<p>Chapters loading...</p>";


            document
                .getElementById("message")
                .innerText = "";


            try {

                const url =
                    SUPABASE_URL +
                    "/rest/v1/questions" +
                    "?subject=eq." +
                    encodeURIComponent(subject) +
                    "&select=chapter";


                const response =
                    await fetch(url, {

                        method: "GET",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        }

                    });


                if (!response.ok) {

                    throw new Error(
                        "Chapter load failed: " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                const chapters = [
                    ...new Set(

                        data
                            .map(item => item.chapter)
                            .filter(
                                chapter =>
                                    chapter &&
                                    chapter.trim() !== ""
                            )
                    )
                ];


                chapterList.innerHTML = "";


                if (chapters.length === 0) {

                    chapterList.innerHTML =
                        "<p>इस subject में अभी कोई chapter नहीं है।</p>";

                    return;
                }


                chapters.forEach(chapter => {

                    const button =
                        document.createElement("button");


                    button.className =
                        "chapter-btn";


                    button.innerText =
                        chapter;


                    button.addEventListener(
                        "click",
                        function () {

                            loadQuestions(
                                subject,
                                chapter
                            );

                        }
                    );


                    chapterList.appendChild(button);

                });

            }

            catch (error) {

                console.error(error);


                chapterList.innerHTML =
                    "<p>Chapter load नहीं हो पाया।</p>";


                document
                    .getElementById("message")
                    .innerText =
                        "Database से data load करने में problem हुई।";

            }

        }


        /* =========================
           LOAD QUESTIONS
        ========================== */

        async function loadQuestions(
            subject,
            chapter
        ) {

            selectedSubject = subject;

            selectedChapter = chapter;


            hideAllPages();


            document
                .getElementById("quizPage")
                .classList.remove("hidden");


            document
                .getElementById("quizTitle")
                .innerText =
                    subject +
                    " - " +
                    chapter;


            document
                .getElementById("questionBox")
                .innerHTML =
                    "<p>Questions loading...</p>";


            document
                .getElementById("optionsBox")
                .innerHTML = "";


            document
                .getElementById("progress")
                .innerText = "";


            try {

                const url =
                    SUPABASE_URL +
                    "/rest/v1/questions" +
                    "?subject=eq." +
                    encodeURIComponent(subject) +
                    "&chapter=eq." +
                    encodeURIComponent(chapter) +
                    "&select=*";


                console.log(
                    "Loading questions:",
                    url
                );


                const response =
                    await fetch(url, {

                        method: "GET",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        }

                    });


                if (!response.ok) {

                    throw new Error(
                        "Question load failed: " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                questions = data;


                if (questions.length === 0) {

                    document
                        .getElementById("questionBox")
                        .innerHTML =
                            "<p>इस chapter में अभी कोई question नहीं है।</p>";

                    return;
                }


                currentQuestion = 0;

                score = 0;


                showQuestion();

            }

            catch (error) {

                console.error(error);


                document
                    .getElementById("questionBox")
                    .innerHTML =
                        "<p>Questions load नहीं हो पाए।</p>";


                document
                    .getElementById("optionsBox")
                    .innerHTML = "";


                document
                    .getElementById("message")
                    .innerText =
                        "Question load करने में problem हुई।";

            }

        }


        /* =========================
           SHOW QUESTION
        ========================== */

        function showQuestion() {

            const question =
                questions[currentQuestion];


            document
                .getElementById("progress")
                .innerText =
                    "Question " +
                    (currentQuestion + 1) +
                    " / " +
                    questions.length;


            const questionBox =
                document.getElementById(
                    "questionBox"
                );


            questionBox.innerHTML = "";


            const questionText =
                document.createElement("div");


            questionText.className =
                "question";


            questionText.innerText =
                question.question;


            questionBox.appendChild(
                questionText
            );


            const optionsBox =
                document.getElementById(
                    "optionsBox"
                );


            optionsBox.innerHTML = "";


            const options = [

                {
                    text: question.option_a,
                    index: 0
                },

                {
                    text: question.option_b,
                    index: 1
                },

                {
                    text: question.option_c,
                    index: 2
                },

                {
                    text: question.option_d,
                    index: 3
                }

            ];


            options.forEach(option => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option";


                button.innerText =
                    option.text;


                button.addEventListener(
                    "click",
                    function () {

                        checkAnswer(
                            option.index,
                            button
                        );

                    }
                );


                optionsBox.appendChild(
                    button
                );

            });


            document
                .getElementById("nextButton")
                .classList.add("hidden");


            /* Page ko question ke top par le aao */

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================
           CHECK ANSWER
        ========================== */

        function checkAnswer(
            selectedIndex,
            selectedButton
        ) {

            const question =
                questions[currentQuestion];


            const correctIndex =
                Number(
                    question.correct_answer
                );


            const optionButtons =
                document.querySelectorAll(
                    ".option"
                );


            optionButtons.forEach(
                button => {

                    button.disabled = true;

                }
            );


            if (
                selectedIndex ===
                correctIndex
            ) {

                selectedButton
                    .classList
                    .add("correct");


                score++;

            }

            else {

                selectedButton
                    .classList
                    .add("wrong");


                if (
                    optionButtons[
                        correctIndex
                    ]
                ) {

                    optionButtons[
                        correctIndex
                    ]
                    .classList
                    .add("correct");

                }

            }


            document
                .getElementById("nextButton")
                .classList
                .remove("hidden");

        }


        /* =========================
           NEXT QUESTION
        ========================== */

        document
            .getElementById("nextButton")
            .addEventListener(
                "click",
                function () {

                    currentQuestion++;


                    if (
                        currentQuestion >=
                        questions.length
                    ) {

                        showResult();

                        return;

                    }


                    showQuestion();

                }
            );


        /* =========================
           RESULT
        ========================== */

        function showResult() {

            hideAllPages();


            document
                .getElementById("resultPage")
                .classList
                .remove("hidden");


            document
                .getElementById("score")
                .innerText =
                    "आपका Score: " +
                    score +
                    " / " +
                    questions.length;

        }


        /* =========================
           RESTART
        ========================== */

        document
            .getElementById("restartButton")
            .addEventListener(
                "click",
                function () {

                    currentQuestion = 0;

                    score = 0;

                    hideAllPages();

                    document
                        .getElementById("quizPage")
                        .classList
                        .remove("hidden");

                    showQuestion();

                }
            );


        /* =========================
           BACK BUTTONS
        ========================== */

        document
            .getElementById("backToSubjects")
            .addEventListener(
                "click",
                function () {

                    showSubjects();

                }
            );


        document
            .getElementById("backToChapters")
            .addEventListener(
                "click",
                function () {

                    showChapters();

                }
            );


        document
            .getElementById("resultBackButton")
            .addEventListener(
                "click",
                function () {

                    showChapters();

                }
            );

    </script>

</body>
</html>
