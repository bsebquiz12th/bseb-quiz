<script>

async function handleAuth(){

  const name =
    $("authName").value.trim();

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPassword").value;

  const message =
    $("authMessage");


  /* ================= VALIDATION ================= */

  if(!email || !password){

    message.style.color =
      "#c62828";

    message.innerText =
      "Email और password भरें।";

    return;
  }


  if(password.length < 6){

    message.style.color =
      "#c62828";

    message.innerText =
      "Password कम से कम 6 characters का होना चाहिए।";

    return;
  }


  message.style.color =
    "#073b78";

  message.innerText =
    "Please wait...";


  /* ================= SIGNUP ================= */

  if(authMode === "signup"){

    if(!name){

      message.style.color =
        "#c62828";

      message.innerText =
        "अपना नाम भरें।";

      return;
    }


    const {
      data,
      error
    } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:name
        }
      }

    });


    if(error){

      message.style.color =
        "#c62828";

      message.innerText =
        error.message;

      return;
    }


    /*
      Account बनने के बाद
      Chapter page नहीं खुलेगा।

      अब सीधे Home page खुलेगा।
    */

    if(data.session){

      message.style.color =
        "#176b35";

      message.innerText =
        "Account created successfully!";

      goHome();

      return;
    }


    /*
      अगर email confirmation ON है
    */

    message.style.color =
      "#176b35";

    message.innerText =
      "Account बन गया है। Email verify करके Login करें।";

    return;

  }


  /* ================= LOGIN ================= */

  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    message.style.color =
      "#c62828";

    message.innerText =
      error.message;

    return;
  }


  /*
    LOGIN SUCCESS

    पहले Home खुलेगा।
    Chapter अपने-आप नहीं खुलेगा।
  */

  if(data.session){

    goHome();

  }

}

</script>
