<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSEB Class 12 Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: lightblue;
            padding: 20px;
            text-align: center;
        }

        .box {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            padding: 25px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            color: darkblue;
            margin: 5px 0 18px;
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 12px auto;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .subject,
        .chapter-btn {
            background: darkblue;
            color: white;
        }

        .subject:hover,
        .chapter-btn:hover {
            background: blue;
        }

        .question {
            width: 100%;
            padding: 20px;
            margin: 20px 0;
            background: #f3f6ff;
            border: 2px solid #d6ddf5;
            border-radius: 12px;

            font-size: 21px;
            line-height: 1.6;
            font-weight: bold;
            text-align: left;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .option {
            background: #eeeeee;
            color: #111;
            border: 2px solid #cccccc;
            text-align: left;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .option:hover {
            background: #dddddd;
        }

        .correct {
            background: lightgreen !important;
            border-color: green !important;
            color: darkgreen !important;
        }

        .wrong {
            background: #ffb3b3 !important;
            border-color: red !important;
            color: darkred !important;
        }

        .next {
            background: darkblue;
            color: white;
        }

        .back {
            background: #555;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        #progress {
            font-weight: bold;
            color: #333;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: darkblue;
        }

        #message {
            color: red;
            font-weight: bold;
            margin: 10px;
        }

        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            .box {
                margin: 5px auto;
                padding: 18px 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 23px;
            }

            h2 {
                font-size: 19px;
            }

            button {
                font-size: 17px;
                padding: 14px 10px;
            }

            .question {
                font-size: 18px;
                line-height: 1.55;
                padding: 15px 12px;
            }

            .option {
                font-size: 17px;
                line-height: 1.45;
                padding: 14px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- SUBJECT PAGE -->

    <div id="subjectPage" class="box">

        <h1>📚 BSEB Class 12 Quiz</h1>

        <h2>अपना Subject चुनें</h2>

        <button type="button" class="subject"
                onclick="selectSubject('Physics')">
            ⚡ Physics
        </button>

        <button type="button" class="subject"
                onclick="selectSubject('Chemistry')">
            ⚗️ Chemistry
        </button>

        <button type="button" class="subject"
                onclick="selectSubject('Maths')">
            📐 Maths
        </button>

        <button type="button" class="subject"
                onclick="selectSubject('Biology')">
            🧬 Biology
        </button>

        <button type="button" class="subject"
                onclick="selectSubject('Hindi')">
            📖 Hindi
        </button>

        <button type="button" class="subject"
                onclick="selectSubject('English')">
            📘 English
        </button>

    </div>


    <!-- CHAPTER PAGE -->

    <div id="chapterPage" class="box hidden">

        <h1 id="chapterTitle"></h1>

        <div id="chapterList"></div>

        <button type="button"
                class="back"
                onclick="goSubjects()">
            ⬅️ Subjects
        </button>

    </div>


    <!-- QUIZ PAGE -->

    <div id="quizPage" class="box hidden">

        <h1 id="quizTitle"></h1>

        <p id="progress"></p>

        <div id="questionBox"></div>

        <div id="optionsBox"></div>

        <button type="button"
                id="nextButton"
                class="next hidden"
                onclick="nextQuestion()">
            Next Question ➡️
        </button>

        <button type="button"
                class="back"
                onclick="goChapters()">
            ⬅️ Chapters
        </button>

    </div>


    <!-- RESULT PAGE -->

    <div id="resultPage" class="box hidden">

        <h1>🎉 Quiz Complete</h1>

        <p id="score"></p>

        <button type="button"
                class="next"
                onclick="restartQuiz()">
            🔄 फिर से खेलें
        </button>

        <button type="button"
                class="back"
                onclick="goChapters()">
            ⬅️ Chapters
        </button>

    </div>


    <div id="message"></div>


<script>

const SUPABASE_URL =
    "https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";


let selectedSubject = "";
let selectedChapter = "";

let questions = [];
let currentQuestion = 0;
let score = 0;


/* =========================
   HIDE ALL PAGES
========================= */

function hidePages() {

    document.getElementById("subjectPage")
        .classList.add("hidden");

    document.getElementById("chapterPage")
        .classList.add("hidden");

    document.getElementById("quizPage")
        .classList.add("hidden");

    document.getElementById("resultPage")
        .classList.add("hidden");
}


/* =========================
   SUBJECT
========================= */

function selectSubject(subject) {

    selectedSubject = subject;

    loadChapters(subject);
}


/* =========================
   LOAD CHAPTERS
========================= */

async function loadChapters(subject) {

    hidePages();

    document.getElementById("chapterPage")
        .classList.remove("hidden");

    document.getElementById("chapterTitle")
        .innerText = subject + " - Chapters";

    const list =
        document.getElementById("chapterList");

    list.innerHTML =
        "<p>Chapters loading...</p>";

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/questions" +
            "?subject=eq." +
            encodeURIComponent(subject) +
            "&select=chapter";

        const response =
            await fetch(url, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            });


        if (!response.ok) {

            throw new Error(
                "Chapter error " + response.status
            );
        }


        const data =
            await response.json();


        const chapterSet = new Set();


        data.forEach(item => {

            if (
                item.chapter &&
                item.chapter.trim() !== ""
            ) {

                chapterSet.add(
                    item.chapter.trim()
                );

            }

        });


        const chapters =
            Array.from(chapterSet);


        list.innerHTML = "";


        if (chapters.length === 0) {

            list.innerHTML =
                "<p>इस subject में अभी कोई chapter नहीं है।</p>";

            return;
        }


        chapters.forEach(chapter => {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "chapter-btn";

            button.innerText =
                chapter;


            /*
               IMPORTANT:
               Direct click handler
            */

            button.onclick = function(event) {

                event.preventDefault();
                event.stopPropagation();

                loadQuestions(
                    subject,
                    chapter
                );

            };


            list.appendChild(button);

        });

    }

    catch (error) {

        console.error(error);

        list.innerHTML =
            "<p>Chapter load नहीं हो पाया।</p>";

        document.getElementById("message")
            .innerText =
            "Database से chapter load करने में problem हुई।";
    }
}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(
    subject,
    chapter
) {

    selectedSubject = subject;
    selectedChapter = chapter;


    hidePages();

    document.getElementById("quizPage")
        .classList.remove("hidden");


    document.getElementById("quizTitle")
        .innerText =
        subject + " - " + chapter;


    document.getElementById("questionBox")
        .innerHTML =
        "<p>Questions loading...</p>";

    document.getElementById("optionsBox")
        .innerHTML = "";

    document.getElementById("progress")
        .innerText = "";


    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/questions" +
            "?subject=eq." +
            encodeURIComponent(subject) +
            "&chapter=eq." +
            encodeURIComponent(chapter) +
            "&select=*";


        console.log(
            "QUESTION URL:",
            url
        );


        const response =
            await fetch(url, {

                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            });


        if (!response.ok) {

            throw new Error(
                "Question error " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "QUESTIONS:",
            data
        );


        questions = data;


        if (questions.length === 0) {

            document.getElementById("questionBox")
                .innerHTML =
                "<p>इस chapter में अभी कोई question नहीं है।</p>";

            return;
        }


        currentQuestion = 0;
        score = 0;


        showQuestion();

    }

    catch (error) {

        console.error(error);

        document.getElementById("questionBox")
            .innerHTML =
            "<p>Questions load नहीं हो पाए।</p>";

        document.getElementById("optionsBox")
            .innerHTML = "";

        document.getElementById("message")
            .innerText =
            "Question load करने में problem हुई।";
    }
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    const q =
        questions[currentQuestion];


    document.getElementById("progress")
        .innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    const questionBox =
        document.getElementById(
            "questionBox"
        );


    questionBox.innerHTML = "";


    const question =
        document.createElement("div");


    question.className =
        "question";


    question.innerText =
        q.question;


    questionBox.appendChild(
        question
    );


    const optionsBox =
        document.getElementById(
            "optionsBox"
        );


    optionsBox.innerHTML = "";


    const options = [

        q.option_a,
        q.option_b,
        q.option_c,
        q.option_d

    ];


    options.forEach(
        (text, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "option";


            button.innerText =
                text;


            button.onclick =
                function() {

                    checkAnswer(
                        index,
                        button
                    );

                };


            optionsBox.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "nextButton"
    )
    .classList
    .add("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    selectedIndex,
    selectedButton
) {

    const q =
        questions[currentQuestion];


    const correctIndex =
        Number(q.correct_answer);


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        button => {
            button.disabled = true;
        }
    );


    if (
        selectedIndex ===
        correctIndex
    ) {

        selectedButton
            .classList
            .add("correct");

        score++;

    }

    else {

        selectedButton
            .classList
            .add("wrong");


        if (buttons[correctIndex]) {

            buttons[correctIndex]
                .classList
                .add("correct");

        }

    }


    document.getElementById(
        "nextButton"
    )
    .classList
    .remove("hidden");
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        showResult();

        return;
    }


    showQuestion();
}


/* =========================
   RESULT
========================= */

function showResult() {

    hidePages();

    document.getElementById(
        "resultPage"
    )
    .classList
    .remove("hidden");


    document.getElementById(
        "score"
    )
    .innerText =
        "आपका Score: " +
        score +
        " / " +
        questions.length;
}


/* =========================
   RESTART
========================= */

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    hidePages();

    document.getElementById(
        "quizPage"
    )
    .classList
    .remove("hidden");


    showQuestion();
}


/* =========================
   BACK TO SUBJECTS
========================= */

function goSubjects() {

    hidePages();

    document.getElementById(
        "subjectPage"
    )
    .classList
    .remove("hidden");
}


/* =========================
   BACK TO CHAPTERS
========================= */

function goChapters() {

    loadChapters(
        selectedSubject
    );
}

</script>

</body>
</html>
