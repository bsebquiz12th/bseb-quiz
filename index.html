<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>BSEB Class 12 Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
        }

        button {
            display: block;
            width: 90%;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .subject {
            background-color: darkblue;
            color: white;
        }

        .subject:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>📚 BSEB Class 12 Quiz</h1>

    <h2>अपना Subject चुनें</h2>

    <button class="subject" onclick="alert('Physics Quiz')">
        ⚡ Physics
    </button>

    <button class="subject" onclick="alert('Chemistry Quiz')">
        ⚗️ Chemistry
    </button>

    <button class="subject" onclick="alert('Maths Quiz')">
        📐 Maths
    </button>

    <button class="subject" onclick="alert('Hindi Quiz')">
        📖 Hindi
    </button>

</div>

</body>
</html>
