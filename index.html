<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSEB Class 12 Objective Quiz</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  margin:0;
  padding:20px;
}

.box{
  max-width:800px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px #ddd;
}

h1,h2{
  text-align:center;
}

button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:8px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.back{
  background:#6c757d;
}

.option{
  background:#f1f3f5;
  color:#222;
  border:1px solid #ddd;
  text-align:left;
}

.correct{
  background:#198754 !important;
  color:white !important;
}

.wrong{
  background:#dc3545 !important;
  color:white !important;
}

.hidden{
  display:none;
}

.info{
  background:#eef3ff;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  text-align:center;
}

#question{
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}

#result{
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- SUBJECT PAGE -->
<div class="box" id="subjectPage">

<h1>📚 BSEB Class 12 Quiz</h1>

<h2>Subject चुनें</h2>

<button onclick="selectSubject('Physics')">
Physics
</button>

<button onclick="selectSubject('Chemistry')">
Chemistry
</button>

<button onclick="selectSubject('Maths')">
Maths
</button>

<button onclick="selectSubject('Biology')">
Biology
</button>

<button onclick="selectSubject('Hindi')">
Hindi
</button>

<button onclick="selectSubject('English')">
English
</button>

</div>


<!-- CHAPTER PAGE -->
<div class="box hidden" id="chapterPage">

<h2 id="chapterTitle">
Chapter चुनें
</h2>

<button class="back" onclick="goSubjects()">
⬅️ Subjects
</button>

<div id="chapterList"></div>

</div>


<!-- QUIZ PAGE -->
<div class="box hidden" id="quizPage">

<button class="back" onclick="goChapters()">
⬅️ Chapters
</button>

<div class="info">
<span id="progress"></span>
<br>
Score: <span id="score">0</span>
</div>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button
id="nextBtn"
class="hidden"
onclick="nextQuestion()"
>
Next Question ➡️
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = supabase.createClient(
  "https://mtykdutibbyufmchaqqj.supabase.co",
  "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C"
);


let selectedSubject = "";

let selectedChapter = "";

let questions = [];

let currentQuestion = 0;

let score = 0;


// SELECT SUBJECT
async function selectSubject(subject){

  selectedSubject = subject;

  document
    .getElementById("subjectPage")
    .classList.add("hidden");

  document
    .getElementById("chapterPage")
    .classList.remove("hidden");

  document
    .getElementById("chapterTitle")
    .textContent =
      subject + " - Chapter चुनें";

  loadChapters();
}


// LOAD CHAPTERS
async function loadChapters(){

  const list =
    document.getElementById("chapterList");

  list.innerHTML =
    "Chapters load हो रहे हैं...";


  const {data,error} =
    await db
      .from("questions")
      .select("chapter")
      .eq("subject",selectedSubject);


  if(error){

    list.innerHTML =
      "Error: " + error.message;

    return;

  }


  const chapters =
    [...new Set(
      data
        .map(x => x.chapter)
        .filter(Boolean)
    )];


  if(!chapters.length){

    list.innerHTML =
      "इस subject में अभी कोई chapter नहीं है।";

    return;

  }


  list.innerHTML =
    chapters.map(chapter => `

      <button
        onclick="selectChapter(${JSON.stringify(chapter)})"
      >
        📖 ${esc(chapter)}
      </button>

    `).join("");

}


// SELECT CHAPTER
async function selectChapter(chapter){

  selectedChapter = chapter;

  currentQuestion = 0;

  score = 0;

  document
    .getElementById("chapterPage")
    .classList.add("hidden");

  document
    .getElementById("quizPage")
    .classList.remove("hidden");


  await loadQuestions();

}


// LOAD QUESTIONS
async function loadQuestions(){

  const {data,error} =
    await db
      .from("questions")
      .select("*")
      .eq("subject",selectedSubject)
      .eq("chapter",selectedChapter)
      .order("id",{ascending:true});


  if(error){

    document.getElementById("question").textContent =
      "Questions load नहीं हुए: " + error.message;

    return;

  }


  questions = data || [];

  score = 0;

  currentQuestion = 0;


  if(!questions.length){

    document.getElementById("question").textContent =
      "इस chapter में अभी कोई question नहीं है।";

    document.getElementById("options").innerHTML = "";

    return;

  }


  showQuestion();

}


// SHOW QUESTION
function showQuestion(){

  const q =
    questions[currentQuestion];


  document.getElementById("progress").textContent =
    "Question " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


  document.getElementById("score").textContent =
    score;


  document.getElementById("question").textContent =
    q.question;


  const options = [

    q.option_a,
    q.option_b,
    q.option_c,
    q.option_d

  ];


  const optionsBox =
    document.getElementById("options");


  optionsBox.innerHTML =
    options.map((option,index) => `

      <button
        class="option"
        onclick="answerQuestion(${index})"
        id="option${index}"
      >
        ${esc(option)}
      </button>

    `).join("");


  document
    .getElementById("nextBtn")
    .classList.add("hidden");


  document
    .getElementById("result")
    .textContent = "";

}


// ANSWER
function answerQuestion(selected){

  const q =
    questions[currentQuestion];


  const buttons =
    document.querySelectorAll(".option");


  buttons.forEach(button => {

    button.disabled = true;

  });


  if(selected === q.correct_answer){

    buttons[selected]
      .classList.add("correct");

    score++;

  }else{

    buttons[selected]
      .classList.add("wrong");

    buttons[q.correct_answer]
      .classList.add("correct");

  }


  document.getElementById("score").textContent =
    score;


  document
    .getElementById("nextBtn")
    .classList.remove("hidden");

}


// NEXT QUESTION
function nextQuestion(){

  currentQuestion++;


  if(currentQuestion >= questions.length){

    showResult();

    return;

  }


  showQuestion();

}


// RESULT
function showResult(){

  document
    .getElementById("question")
    .textContent =
      "🎉 Quiz Complete!";


  document
    .getElementById("options")
    .innerHTML = "";


  document
    .getElementById("nextBtn")
    .classList.add("hidden");


  document
    .getElementById("result")
    .textContent =
      "आपका Score: " +
      score +
      " / " +
      questions.length;

}


// GO SUBJECTS
function goSubjects(){

  document
    .getElementById("chapterPage")
    .classList.add("hidden");

  document
    .getElementById("quizPage")
    .classList.add("hidden");

  document
    .getElementById("subjectPage")
    .classList.remove("hidden");

}


// GO CHAPTERS
function goChapters(){

  document
    .getElementById("quizPage")
    .classList.add("hidden");

  document
    .getElementById("chapterPage")
    .classList.remove("hidden");

  loadChapters();

}


// ESCAPE HTML
function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}

</script>

</body>
</html>
