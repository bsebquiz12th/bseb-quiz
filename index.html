<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSEB Class 12 Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: lightblue;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 18px;
            box-sizing: border-box;
        }

        h1 {
            color: darkblue;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            display: block;
            width: 90%;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .subject,
        .chapter-btn {
            background: darkblue;
            color: white;
        }

        .subject:hover,
        .chapter-btn:hover {
            background: blue;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .option {
            background: #eeeeee;
            color: black;
            border: 2px solid #ddd;
        }

        .option:hover {
            background: #dddddd;
        }

        .correct {
            background: lightgreen !important;
            border-color: green !important;
        }

        .wrong {
            background: #ffb3b3 !important;
            border-color: red !important;
        }

        .back {
            background: #555;
            color: white;
            width: 50%;
        }

        .next {
            background: darkblue;
            color: white;
        }

        .hidden {
            display: none;
        }

        #message {
            color: red;
            font-weight: bold;
            margin: 15px;
        }

        #score {
            font-size: 22px;
            font-weight: bold;
            color: darkblue;
        }
    </style>
</head>

<body>

<!-- SUBJECT PAGE -->
<div id="subjectPage" class="box">

    <h1>📚 BSEB Class 12 Quiz</h1>
    <h2>अपना Subject चुनें</h2>

    <button class="subject" data-subject="Physics">⚡ Physics</button>
    <button class="subject" data-subject="Chemistry">⚗️ Chemistry</button>
    <button class="subject" data-subject="Maths">📐 Maths</button>
    <button class="subject" data-subject="Biology">🧬 Biology</button>
    <button class="subject" data-subject="Hindi">📖 Hindi</button>
    <button class="subject" data-subject="English">📘 English</button>

</div>


<!-- CHAPTER PAGE -->
<div id="chapterPage" class="box hidden">

    <h1 id="chapterTitle">Chapters</h1>

    <div id="chapterList"></div>

    <button class="back" onclick="showSubjects()">⬅️ Back</button>

</div>


<!-- QUIZ PAGE -->
<div id="quizPage" class="box hidden">

    <h1 id="quizTitle">Quiz</h1>

    <p id="progress"></p>

    <div id="questionBox"></div>

    <div id="optionsBox"></div>

    <button id="nextButton" class="next hidden">
        Next Question ➡️
    </button>

    <button id="backToChapters" class="back">
        ⬅️ Chapters
    </button>

</div>


<!-- RESULT PAGE -->
<div id="resultPage" class="box hidden">

    <h1>🎉 Quiz Complete</h1>

    <p id="score"></p>

    <button class="next" onclick="restartQuiz()">
        🔄 फिर से खेलें
    </button>

    <button class="back" onclick="showChapters()">
        ⬅️ Chapters
    </button>

</div>


<div id="message"></div>


<script>

const SUPABASE_URL =
    "https://mtykdutibbyufmchaqqj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_dNVwJjQvTK6Fe2_CDsrsBg_cYBBVH_C";


let selectedSubject = "";
let selectedChapter = "";

let questions = [];
let currentQuestion = 0;
let score = 0;


// -----------------------------
// PAGE CONTROL
// -----------------------------

function hideAllPages() {
    document.getElementById("subjectPage").classList.add("hidden");
    document.getElementById("chapterPage").classList.add("hidden");
    document.getElementById("quizPage").classList.add("hidden");
    document.getElementById("resultPage").classList.add("hidden");
}


function showSubjects() {
    hideAllPages();

    document.getElementById("subjectPage")
        .classList.remove("hidden");
}


function showChapters() {
    hideAllPages();

    document.getElementById("chapterPage")
        .classList.remove("hidden");

    loadChapters(selectedSubject);
}


// -----------------------------
// SUBJECT SELECTION
// -----------------------------

document.querySelectorAll(".subject").forEach(button => {

    button.addEventListener("click", function () {

        selectedSubject = this.dataset.subject;

        loadChapters(selectedSubject);

    });

});


// -----------------------------
// LOAD CHAPTERS
// -----------------------------

async function loadChapters(subject) {

    hideAllPages();

    document.getElementById("chapterPage")
        .classList.remove("hidden");

    document.getElementById("chapterTitle").innerText =
        subject + " - Chapters";

    const chapterList =
        document.getElementById("chapterList");

    chapterList.innerHTML =
        "<p>Chapters loading...</p>";

    document.getElementById("message").innerText = "";

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/questions" +
            "?subject=eq." +
            encodeURIComponent(subject) +
            "&select=chapter";

        const response = await fetch(url, {

            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }

        });


        if (!response.ok) {

            throw new Error(
                "Chapter load failed: " + response.status
            );

        }


        const data = await response.json();


        const chapters = [
            ...new Set(
                data
                    .map(item => item.chapter)
                    .filter(chapter => chapter)
            )
        ];


        chapterList.innerHTML = "";


        if (chapters.length === 0) {

            chapterList.innerHTML =
                "<p>इस subject में अभी कोई chapter नहीं है।</p>";

            return;
        }


        chapters.forEach(chapter => {

            const button =
                document.createElement("button");

            button.className = "chapter-btn";

            button.innerText = chapter;

            button.addEventListener("click", function () {

                loadQuestions(subject, chapter);

            });

            chapterList.appendChild(button);

        });

    }

    catch (error) {

        console.error(error);

        chapterList.innerHTML =
            "<p>Chapter load नहीं हो पाया।</p>";

        document.getElementById("message").innerText =
            "Database से data load करने में problem हुई।";

    }

}


// -----------------------------
// LOAD QUESTIONS
// -----------------------------

async function loadQuestions(subject, chapter) {

    selectedSubject = subject;
    selectedChapter = chapter;

    hideAllPages();

    document.getElementById("quizPage")
        .classList.remove("hidden");

    document.getElementById("quizTitle").innerText =
        subject + " - " + chapter;

    document.getElementById("questionBox").innerHTML =
        "<p>Questions loading...</p>";

    document.getElementById("optionsBox").innerHTML = "";

    document.getElementById("progress").innerText = "";

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/questions" +
            "?subject=eq." +
            encodeURIComponent(subject) +
            "&chapter=eq." +
            encodeURIComponent(chapter) +
            "&select=*";

        console.log("Loading questions:", url);


        const response = await fetch(url, {

            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }

        });


        if (!response.ok) {

            throw new Error(
                "Question load failed: " + response.status
            );

        }


        const data = await response.json();


        questions = data;


        if (questions.length === 0) {

            document.getElementById("questionBox").innerHTML =
                "<p>इस chapter में अभी कोई question नहीं है।</p>";

            return;
        }


        currentQuestion = 0;
        score = 0;

        showQuestion();

    }

    catch (error) {

        console.error(error);

        document.getElementById("questionBox").innerHTML =
            "<p>Questions load नहीं हो पाए।</p>";

        document.getElementById("optionsBox").innerHTML = "";

        document.getElementById("message").innerText =
            "Question load करने में problem हुई।";

    }

}


// -----------------------------
// SHOW QUESTION
// -----------------------------

function showQuestion() {

    const question =
        questions[currentQuestion];


    document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("questionBox").innerHTML =
        '<div class="question">' +
        question.question +
        '</div>';


    const optionsBox =
        document.getElementById("optionsBox");

    optionsBox.innerHTML = "";


    const options = [

        {
            text: question.option_a,
            index: 0
        },

        {
            text: question.option_b,
            index: 1
        },

        {
            text: question.option_c,
            index: 2
        },

        {
            text: question.option_d,
            index: 3
        }

    ];


    options.forEach(option => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText = option.text;

        button.addEventListener("click", function () {

            checkAnswer(option.index, button);

        });

        optionsBox.appendChild(button);

    });


    document.getElementById("nextButton")
        .classList.add("hidden");

}


// -----------------------------
// CHECK ANSWER
// -----------------------------

function checkAnswer(selectedIndex, selectedButton) {

    const question =
        questions[currentQuestion];


    const correctIndex =
        Number(question.correct_answer);


    const optionButtons =
        document.querySelectorAll(".option");


    optionButtons.forEach(button => {

        button.disabled = true;

    });


    if (selectedIndex === correctIndex) {

        selectedButton.classList.add("correct");

        score++;

    }

    else {

        selectedButton.classList.add("wrong");

        optionButtons[correctIndex]
            .classList.add("correct");

    }


    document.getElementById("nextButton")
        .classList.remove("hidden");

}


// -----------------------------
// NEXT QUESTION
// -----------------------------

document.getElementById("nextButton")
    .addEventListener("click", function () {

        currentQuestion++;


        if (currentQuestion >= questions.length) {

            showResult();

            return;

        }


        showQuestion();

    });


// -----------------------------
// RESULT
// -----------------------------

function showResult() {

    hideAllPages();

    document.getElementById("resultPage")
        .classList.remove("hidden");


    document.getElementById("score").innerText =
        "आपका Score: " +
        score +
        " / " +
        questions.length;

}


// -----------------------------
// RESTART
// -----------------------------

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    hideAllPages();

    document.getElementById("quizPage")
        .classList.remove("hidden");

    showQuestion();

}


// -----------------------------
// BACK TO CHAPTERS
// -----------------------------

document.getElementById("backToChapters")
    .addEventListener("click", function () {

        showChapters();

    });

</script>

</body>
</html>
